# Comparison data. The format is defined by fpsot-spec-doc (model/jurisdiction.yaml).
topics:
  plain-language: {en: Plain language, fr: Langage clair}
  keywords: {en: Requirement keywords, fr: Mots clés des exigences}
  language-quality: {en: Language quality, fr: Qualité de la langue}
  interface-text: {en: Interface text, fr: Texte d'interface}
rows:
  - id: WRT-001
    topic: plain-language
    requirement: {en: Write in plain language., fr: Rédiger en langage clair.}
    international: {en: "Principles for plain language in any written language, including technical writing.", fr: "Principes du langage clair pour toute langue écrite, y compris la rédaction technique."}
    international_source: {title: "ISO 24495-1, Plain language, Part 1: Governing principles and guidelines", version: "ISO 24495-1:2023", date: "2023-06", url: "https://www.iso.org/standard/78907.html", archive: "https://web.archive.org/web/20261024010118/https://www.iso.org/standard/78907.html"}
    fpsot: {en: "Readers find, understand and use the text. Sentences of 20 words or fewer, in the active voice.", fr: "Le lecteur trouve, comprend et utilise le texte. Phrases de 20 mots ou moins, à la voix active."}
  - id: WRT-010
    topic: keywords
    requirement: {en: Use the BCP 14 keywords., fr: Utiliser les mots clés du BCP 14.}
    international: {en: "BCP 14 defines MUST, SHOULD and MAY. Only the capital forms carry that meaning.", fr: "Le BCP 14 définit MUST, SHOULD et MAY. Seules les majuscules ont ce sens."}
    international_source: {title: "RFC 8174, Ambiguity of Uppercase vs Lowercase in RFC 2119 Key Words (BCP 14)", version: "BCP 14", date: "2017-05", url: "https://www.rfc-editor.org/info/rfc8174", archive: "https://web.archive.org/web/20261103005743/https://www.rfc-editor.org/info/rfc8174/"}
    fpsot: {en: "Keywords in capitals, with a fixed French mapping.", fr: "Mots clés en majuscules, avec une correspondance française fixe."}
  - id: WRT-031
    topic: language-quality
    requirement: {en: French follows OQLF usage., fr: "Le français suit l'usage de l'OQLF."}
    international: {en: "Spelling must be consistent. British, American and French dictionaries are suggested.", fr: "L'orthographe doit être uniforme. Des dictionnaires britanniques, américains et français sont suggérés."}
    international_source: {title: "ISO/IEC Directives, Part 2, Principles and rules for the structure and drafting of ISO and IEC documents", date: "2021", url: "https://www.iso.org/sites/directives/current/part2/index.xhtml", archive: "https://web.archive.org/web/20261017090630/https://www.iso.org/sites/directives/current/part2/index.xhtml"}
    fpsot: {en: "Grand dictionnaire terminologique and Banque de dépannage linguistique.", fr: "Grand dictionnaire terminologique et Banque de dépannage linguistique."}
  - id: WRT-032
    topic: language-quality
    requirement: {en: French uses gender-inclusive writing., fr: Le français suit la rédaction inclusive.}
    international: {en: "A clause on inclusive terminology, with no rule on gender in French.", fr: "Une clause sur la terminologie inclusive, sans règle sur le genre en français."}
    international_source: {title: "ISO/IEC Directives, Part 2, Principles and rules for the structure and drafting of ISO and IEC documents", date: "2021", url: "https://www.iso.org/sites/directives/current/part2/index.xhtml", archive: "https://web.archive.org/web/20261017090630/https://www.iso.org/sites/directives/current/part2/index.xhtml"}
    fpsot: {en: "Words that name a group or a role. No new neutral words and no shortened doubled forms in running text.", fr: "Mots qui désignent un groupe ou une fonction. Ni mots neutres nouveaux ni doublets abrégés dans un texte suivi."}
  - id: WRT-040
    topic: interface-text
    requirement: {en: Error messages say what happened and what to do., fr: Les messages d'erreur disent ce qui s'est passé et quoi faire.}
    international: {en: "A detected input error is described in text. A known fix is suggested.", fr: "Une erreur de saisie détectée est décrite par écrit. Une correction connue est proposée."}
    international_source: {title: "Web Content Accessibility Guidelines (WCAG) 2.2 (3.3.1, 3.3.3)", date: "2024-12-12", url: "https://www.w3.org/TR/WCAG22/", archive: "https://web.archive.org/web/20261103005900/https://www.w3.org/TR/WCAG22/"}
    fpsot: {en: "Also no blame, in the reader's words.", fr: "Aussi sans blâme, dans les mots du lecteur."}
