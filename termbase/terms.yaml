# SPDX-License-Identifier: Community-Spec-1.0
# FPSOT term base. Format: model/termbase.yaml. Definitions are FPSOT wording.
terms:
  - id: aria
    kind: abbreviation
    en: {short: "ARIA", full: "Accessible Rich Internet Applications", definition: "W3C attributes that tell assistive technologies the role, state and name of a part of a web page."}
    fr: {short: "ARIA", full: "Accessible Rich Internet Applications", definition: "Attributs du W3C qui indiquent aux technologies d'assistance le rôle, l'état et le nom d'une partie d'une page Web."}
    source: {name: "W3C, WAI-ARIA 1.2 (no GDT record found; TERMIUM Plus not checked)", url: "https://www.w3.org/TR/wai-aria-1.2/", checked: "2026-11-05"}
  - id: bpmn
    kind: abbreviation
    en: {short: "BPMN", full: "Business Process Model and Notation", definition: "An Object Management Group notation for drawing business processes that both business and technical staff can read."}
    fr: {short: "BPMN", full: "modèle de procédé d'affaire et notation", definition: "Notation de l'Object Management Group qui sert à dessiner des processus d'affaires lisibles par le personnel des affaires comme par le personnel technique."}
    source: {name: "ISO/IEC 19510:2013 (French title)", url: "https://www.iso.org/standard/62652.html", checked: "2026-11-05"}
  - id: css
    kind: abbreviation
    en: {short: "CSS", full: "Cascading Style Sheets", definition: "The W3C language that sets how web pages look, such as colors, fonts and layout."}
    fr: {short: "CSS", full: "feuilles de style en cascade", definition: "Langage du W3C qui fixe l'apparence des pages Web, comme les couleurs, les polices et la mise en page."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26588742/feuilles-de-style-en-cascade", checked: "2026-11-05"}
  - id: csv
    kind: abbreviation
    en: {short: "CSV", full: "comma-separated values", definition: "A plain text format for tables, with one record per line and commas between the fields."}
    fr: {short: "CSV", full: "comma-separated values", definition: "Format de texte brut pour les tableaux, avec un enregistrement par ligne et des virgules entre les champs."}
    source: {name: "Grand dictionnaire terminologique, fichier CSV (gives the short form only; the English full form is kept)", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8362519/fichier-csv", checked: "2026-11-05"}
  - id: fpsot
    kind: abbreviation
    en: {short: "FPSOT", full: "Foundation for Public Sector Open Technology", definition: "The foundation that publishes these open specifications for public sector technology."}
    fr: {short: "FPSOT", full: "Foundation for Public Sector Open Technology", definition: "Fondation qui publie ces spécifications ouvertes pour les technologies du secteur public."}
    source: {name: "FPSOT", url: "https://fpsot.org/", checked: "2026-11-02"}
  - id: api
    kind: abbreviation
    en: {short: "API", full: "application programming interface", definition: "A documented set of rules that lets one program use the functions or data of another."}
    fr: {short: "API", full: "interface de programmation d'application", definition: "Ensemble documenté de règles qui permet à un programme d'utiliser les fonctions ou les données d'un autre."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8394269/interface-de-programmation-dapplication", checked: "2026-11-02"}
  - id: ascii
    kind: abbreviation
    en: {short: "ASCII", full: "American Standard Code for Information Interchange", definition: "A 7-bit character code for the letters, digits and signs of English text."}
    fr: {short: "ASCII", full: "code ASCII (American Standard Code for Information Interchange)", definition: "Code de caractères sur 7 bits pour les lettres, les chiffres et les signes de l'anglais."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8358861/code-ascii", checked: "2026-11-04"}
  - id: asvs
    kind: abbreviation
    en: {short: "ASVS", full: "Application Security Verification Standard", definition: "An OWASP standard that lists security requirements for applications, in three levels of assurance."}
    fr: {short: "ASVS", full: "Application Security Verification Standard", definition: "Norme de l'OWASP qui énumère des exigences de sécurité pour les applications, selon trois niveaux d'assurance."}
    source: {name: "OWASP, ASVS 5.0.0 (no GDT record found; TERMIUM Plus could not be read)", url: "https://asvs.owasp.org/", checked: "2026-11-08"}
  - id: bcp
    kind: abbreviation
    en: {short: "BCP", full: "Best Current Practice", definition: "An IETF document series that records the agreed best way to run or use Internet technology."}
    fr: {short: "BCP", full: "Best Current Practice", definition: "Série de documents de l'IETF qui consigne la façon reconnue de faire fonctionner ou d'utiliser les technologies Internet."}
    source: {name: "RFC 2026", url: "https://www.rfc-editor.org/rfc/rfc2026.txt", checked: "2026-11-02"}
  - id: bdd
    kind: abbreviation
    en: {short: "BDD", full: "behavior-driven development", definition: "A way of working in which domain experts, developers and testers agree on the expected behavior of a system through examples, which then become its tests."}
    fr: {short: "BDD", full: "behavior-driven development", definition: "Façon de travailler où les spécialistes du domaine, les équipes de développement et les équipes de test s'entendent sur le comportement attendu d'un système au moyen d'exemples, qui deviennent ensuite ses tests."}
    source: {name: "ISTQB Glossary 4.8.1, behavior-driven development, French version (no GDT record found)", url: "https://glossary.istqb.org/en_US/term/behavior-driven-development", checked: "2026-11-08"}
  - id: ci
    kind: abbreviation
    en: {short: "CI", full: "continuous integration", definition: "The practice of merging each person's changes into shared code often, with automatic tests each time."}
    fr: {short: "IC", full: "intégration continue", definition: "Pratique qui consiste à intégrer souvent les changements de chaque personne au code commun, avec des tests automatiques."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26559353/integration-continue", checked: "2026-11-02"}
  - id: cldr
    kind: abbreviation
    en: {short: "CLDR", full: "Unicode Common Locale Data Repository", definition: "Unicode's shared data on how each language and region writes dates, numbers, names and similar items."}
    fr: {short: "CLDR", full: "Unicode Common Locale Data Repository", definition: "Données communes d'Unicode sur la façon d'écrire les dates, les nombres et les noms selon la langue et la région."}
    source: {name: "Unicode Technical Standard #35", url: "https://www.unicode.org/reports/tr35/", checked: "2026-11-02"}
  - id: cors
    kind: abbreviation
    en: {short: "CORS", full: "cross-origin resource sharing", definition: "The browser mechanism that lets a server allow web pages from other origins to read its responses."}
    fr: {short: "CORS", full: "cross-origin resource sharing", definition: "Mécanisme des navigateurs qui permet à un serveur d'autoriser des pages Web d'autres origines à lire ses réponses."}
    source: {name: "WHATWG Fetch Standard (no GDT record found; TERMIUM Plus not checked)", url: "https://fetch.spec.whatwg.org/#http-cors-protocol", checked: "2026-11-03"}
  - id: csl
    kind: abbreviation
    en: {short: "CSL", full: "Community Specification License", definition: "A license that sets how people contribute to and may use a specification developed by a working group."}
    fr: {short: "CSL", full: "Community Specification License", definition: "Licence qui fixe comment contribuer à une spécification élaborée par un groupe de travail et comment l'utiliser."}
    source: {name: "Community Specification", url: "https://github.com/CommunitySpecification/Community_Specification", checked: "2026-11-02"}
  - id: cve
    kind: abbreviation
    en: {short: "CVE", full: "Common Vulnerabilities and Exposures", definition: "The program that gives each publicly known vulnerability a unique identifier, such as CVE-2026-12345."}
    fr: {short: "CVE", full: "Common Vulnerabilities and Exposures", definition: "Programme qui donne à chaque vulnérabilité connue du public un identifiant unique, comme CVE-2026-12345."}
    source: {name: "CVE Program (no GDT record found; TERMIUM Plus could not be read; TBS writes « vulnérabilités et expositions communes »)", url: "https://www.cve.org/", checked: "2026-11-08"}
  - id: cvss
    kind: abbreviation
    en: {short: "CVSS", full: "Common Vulnerability Scoring System", definition: "A FIRST standard that scores the severity of a vulnerability from 0 to 10, with a vector string that records each metric."}
    fr: {short: "CVSS", full: "Common Vulnerability Scoring System", definition: "Norme du FIRST qui cote la gravité d'une vulnérabilité de 0 à 10, avec une chaîne vectorielle qui consigne chaque métrique."}
    source: {name: "FIRST, CVSS v4.0 Specification Document (no GDT record found; TERMIUM Plus could not be read; TBS writes « Système commun de notation des vulnérabilités »)", url: "https://www.first.org/cvss/v4.0/specification-document", checked: "2026-11-08"}
  - id: gpg
    kind: abbreviation
    en: {short: "GPG", full: "GNU Privacy Guard", definition: "Free software that encrypts and signs data and messages with the OpenPGP standard."}
    fr: {short: "GPG", full: "GNU Privacy Guard", definition: "Logiciel libre qui chiffre et signe des données et des messages selon la norme OpenPGP."}
    source: {name: "GnuPG", url: "https://gnupg.org/", checked: "2026-11-02"}
  - id: hsts
    kind: abbreviation
    en: {short: "HSTS", full: "HTTP Strict Transport Security", definition: "A response header that tells browsers to reach a host only over HTTPS for a set time."}
    fr: {short: "HSTS", full: "HTTP Strict Transport Security", definition: "En-tête de réponse qui demande aux navigateurs de n'accéder à un hôte qu'en HTTPS pendant une durée fixée."}
    source: {name: "RFC 6797 (no GDT record found; TERMIUM Plus not checked)", url: "https://www.rfc-editor.org/rfc/rfc6797", checked: "2026-11-03"}
  - id: html
    kind: abbreviation
    en: {short: "HTML", full: "HyperText Markup Language", definition: "The markup language of web pages, which browsers display."}
    fr: {short: "HTML", full: "langage de balisage hypertexte", definition: "Langage de balisage des pages Web, que les navigateurs affichent."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26515006/langage-de-balisage-hypertexte", checked: "2026-11-02"}
  - id: http
    kind: abbreviation
    en: {short: "HTTP", full: "Hypertext Transfer Protocol", definition: "The protocol that web clients and servers use to send requests and responses."}
    fr: {short: "HTTP", full: "protocole HTTP (Hypertext Transfer Protocol)", definition: "Protocole qu'emploient les clients et les serveurs Web pour échanger des requêtes et des réponses."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/2075739/protocole-http", checked: "2026-11-03"}
  - id: https
    kind: abbreviation
    en: {short: "HTTPS", full: "Hypertext Transfer Protocol Secure", definition: "HTTP sent over an encrypted connection, so that others cannot read or change the exchange."}
    fr: {short: "HTTPS", full: "protocole HTTPS (Hypertext Transfer Protocol Secure)", definition: "Protocole HTTP transmis par une connexion chiffrée, pour que des tiers ne puissent ni lire ni modifier l'échange."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26558496/protocole-https", checked: "2026-11-03"}
  - id: iana
    kind: abbreviation
    en: {short: "IANA", full: "Internet Assigned Numbers Authority", definition: "The body that keeps the shared registries of Internet names and numbers, such as language subtags and the time zone database."}
    fr: {short: "IANA", full: "Internet Assigned Numbers Authority", definition: "Organisme qui tient les registres communs des noms et des numéros d'Internet, comme les sous-étiquettes de langue et la base de données des fuseaux horaires."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8370486/iana", checked: "2026-11-03"}
  - id: icu
    kind: abbreviation
    en: {short: "ICU", full: "International Components for Unicode", definition: "Open source libraries for C, C++ and Java that format, sort and translate text with Unicode locale data."}
    fr: {short: "ICU", full: "International Components for Unicode", definition: "Bibliothèques libres pour C, C++ et Java qui mettent en forme, trient et traduisent le texte avec les données régionales d'Unicode."}
    source: {name: "ICU", url: "https://unicode-org.github.io/icu/", checked: "2026-11-04"}
  - id: ietf
    kind: abbreviation
    en: {short: "IETF", full: "Internet Engineering Task Force", definition: "The open body that develops and publishes the technical standards of the Internet."}
    fr: {short: "IETF", full: "groupe de travail IETF (Internet Engineering Task Force)", definition: "Organisme ouvert qui élabore et publie les normes techniques d'Internet."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8874737/groupe-de-travail-ietf", checked: "2026-11-03"}
  - id: iso
    kind: abbreviation
    en: {short: "ISO", full: "International Organization for Standardization", definition: "The international body, based in Geneva, that publishes standards prepared with national standards bodies."}
    fr: {short: "ISO", full: "Organisation internationale de normalisation", definition: "Organisme international établi à Genève qui publie des normes préparées avec les organismes nationaux de normalisation."}
    source: {name: "TERMIUM Plus", url: "https://www.btb.termiumplus.gc.ca/", checked: "2026-11-02"}
  - id: json
    kind: abbreviation
    en: {short: "JSON", full: "JavaScript Object Notation", definition: "A text format for structured data, made of objects, arrays, strings, numbers, booleans and null."}
    fr: {short: "JSON", full: "JavaScript Object Notation", definition: "Format texte pour les données structurées, fait d'objets, de tableaux, de chaînes, de nombres, de booléens et de la valeur null."}
    source: {name: "RFC 8259", url: "https://www.rfc-editor.org/rfc/rfc8259", checked: "2026-11-04"}
  - id: json-ld
    kind: abbreviation
    en: {short: "JSON-LD", full: "JSON for Linking Data", definition: "A W3C format that writes linked data as JSON, so that JSON tools can read it."}
    fr: {short: "JSON-LD", full: "JSON for Linking Data", definition: "Format du W3C qui écrit des données liées en JSON, pour que les outils JSON puissent les lire."}
    source: {name: "json-ld.org, JSON for Linking Data (no GDT record found; TERMIUM Plus could not be read)", url: "https://json-ld.org/", checked: "2026-11-05"}
  - id: nist
    kind: abbreviation
    en: {short: "NIST", full: "National Institute of Standards and Technology", definition: "The United States federal agency that publishes standards and guidance, including on cybersecurity."}
    fr: {short: "NIST", full: "National Institute of Standards and Technology", definition: "Organisme fédéral des États-Unis qui publie des normes et des lignes directrices, notamment en cybersécurité."}
    source: {name: "NIST (no GDT record found; TERMIUM Plus could not be read)", url: "https://www.nist.gov/", checked: "2026-11-08"}
  - id: oqlf
    kind: abbreviation
    en: {short: "OQLF", full: "Office québécois de la langue française", definition: "The Québec government agency responsible for French language policy and terminology."}
    fr: {short: "OQLF", full: "Office québécois de la langue française", definition: "Organisme du gouvernement du Québec chargé de la politique linguistique et de la terminologie."}
    source: {name: "TERMIUM Plus", url: "https://www.btb.termiumplus.gc.ca/", checked: "2026-11-02"}
  - id: osv
    kind: abbreviation
    en: {short: "OSV", full: "Open Source Vulnerability", definition: "An OpenSSF format and database that describe vulnerabilities in open-source packages so that machines can read them."}
    fr: {short: "OSV", full: "Open Source Vulnerability", definition: "Format et base de données de l'OpenSSF qui décrivent les vulnérabilités des paquets libres de façon lisible par machine."}
    source: {name: "OpenSSF, OSV schema 1.9.2 (no GDT record found; TERMIUM Plus could not be read)", url: "https://ossf.github.io/osv-schema/", checked: "2026-11-08"}
  - id: owasp
    kind: abbreviation
    en: {short: "OWASP", full: "Open Worldwide Application Security Project", definition: "An open foundation that publishes guides and lists of risks for the security of software."}
    fr: {short: "OWASP", full: "Open Worldwide Application Security Project", definition: "Fondation ouverte qui publie des guides et des listes de risques sur la sécurité des logiciels."}
    source: {name: "OWASP Foundation (no GDT record found; TERMIUM Plus not checked)", url: "https://owasp.org/", checked: "2026-11-03"}
  - id: owl
    kind: abbreviation
    en: {short: "OWL", full: "Web Ontology Language", definition: "The W3C language for describing the classes and properties of a domain, and the relations between them."}
    fr: {short: "OWL", full: "Web Ontology Language", definition: "Langage du W3C qui sert à décrire les classes et les propriétés d'un domaine, et les relations entre elles."}
    source: {name: "W3C, OWL 2 Web Ontology Language Document Overview (no GDT record found; TERMIUM Plus could not be read)", url: "https://www.w3.org/TR/owl2-overview/", checked: "2026-11-07"}
  - id: pdf
    kind: abbreviation
    en: {short: "PDF", full: "Portable Document Format", definition: "A file format that keeps a document's layout the same on any device or system."}
    fr: {short: "PDF", full: "format de document portable", definition: "Format de fichier qui conserve la mise en page d'un document sur tout appareil ou système."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26514644/format-de-document-portable", checked: "2026-11-02"}
  - id: po
    kind: abbreviation
    en: {short: "PO", full: "Portable Object", definition: "The plain-text translation file format of GNU gettext, with one source string and its translation per entry."}
    fr: {short: "PO", full: "Portable Object", definition: "Format de fichier de traduction en texte brut de GNU gettext, avec une chaîne source et sa traduction par entrée."}
    source: {name: "GNU gettext manual", url: "https://www.gnu.org/software/gettext/manual/html_node/PO-Files.html", checked: "2026-11-04"}
  - id: pr
    kind: abbreviation
    en: {short: "PR", full: "pull request", definition: "A request to review a set of proposed changes and merge them into another branch of a repository."}
    fr: {short: "PR", full: "demande de fusion", definition: "Demande d'examen de modifications proposées en vue de les fusionner dans une autre branche d'un dépôt."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26584234/demande-de-fusion", checked: "2026-11-02"}
  - id: rdf
    kind: abbreviation
    en: {short: "RDF", full: "Resource Description Framework", definition: "The W3C model that describes resources as statements, each made of a subject, a property and a value."}
    fr: {short: "RDF", full: "Resource Description Framework", definition: "Modèle du W3C qui décrit des ressources par des énoncés, chacun formé d'un sujet, d'une propriété et d'une valeur."}
    source: {name: "W3C, RDF 1.1 Concepts and Abstract Syntax (no GDT record found; TERMIUM Plus could not be read)", url: "https://www.w3.org/TR/rdf11-concepts/", checked: "2026-11-05"}
  - id: rest
    kind: abbreviation
    en: {short: "REST", full: "Representational State Transfer", definition: "An architectural style for web services, where clients act on resources through the standard HTTP methods."}
    fr: {short: "REST", full: "Representational State Transfer", definition: "Style d'architecture de services Web où les clients agissent sur des ressources au moyen des méthodes HTTP normalisées."}
    source: {name: "Fielding, Architectural Styles and the Design of Network-based Software Architectures, chapter 5 (no GDT record found; TERMIUM Plus not checked)", url: "https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm", checked: "2026-11-03"}
  - id: rfc
    kind: abbreviation
    en: {short: "RFC", full: "Request for Comments", definition: "A numbered IETF publication that describes Internet protocols, practices or information."}
    fr: {short: "RFC", full: "document RFC (Request for Comments)", definition: "Publication numérotée de l'IETF qui décrit des protocoles, des pratiques ou des renseignements sur Internet."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/2075026/document-rfc", checked: "2026-11-02"}
  - id: sbom
    kind: abbreviation
    en: {short: "SBOM", full: "software bill of materials", definition: "A machine-readable list of the components of a piece of software, with their versions and origin."}
    fr: {short: "SBOM", full: "nomenclature logicielle", definition: "Liste lisible par machine des composants d'un logiciel, avec leurs versions et leur origine."}
    source: {name: "Grand dictionnaire terminologique (SBOM accepted as a loan)", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26584382/nomenclature-logicielle", checked: "2026-11-08"}
  - id: sgqri
    kind: abbreviation
    en: {short: "SGQRI", full: "Standard du gouvernement du Québec sur les ressources informationnelles", definition: "A numbered series of Québec government standards for public bodies' information resources, such as web accessibility."}
    fr: {short: "SGQRI", full: "Standard du gouvernement du Québec sur les ressources informationnelles", definition: "Série numérotée de standards du gouvernement du Québec sur les ressources informationnelles des organismes publics."}
    source: {name: "Autorité des marchés publics", url: "https://www.amp.quebec/en/accessibilite", checked: "2026-11-02"}
  - id: shacl
    kind: abbreviation
    en: {short: "SHACL", full: "Shapes Constraint Language", definition: "The W3C language for describing the conditions that RDF data must meet, so that a tool can check it."}
    fr: {short: "SHACL", full: "Shapes Constraint Language", definition: "Langage du W3C qui sert à décrire les conditions que des données RDF doivent remplir, pour qu'un outil puisse les vérifier."}
    source: {name: "W3C, Shapes Constraint Language (SHACL) (no GDT record found; TERMIUM Plus could not be read)", url: "https://www.w3.org/TR/shacl/", checked: "2026-11-07"}
  - id: skos
    kind: abbreviation
    en: {short: "SKOS", full: "Simple Knowledge Organization System", definition: "The W3C model for publishing code lists, classifications and thesauri as linked data."}
    fr: {short: "SKOS", full: "Simple Knowledge Organization System", definition: "Modèle du W3C qui sert à publier des listes de codes, des classifications et des thésaurus sous forme de données liées."}
    source: {name: "W3C, SKOS Reference (no GDT record found; TERMIUM Plus could not be read)", url: "https://www.w3.org/TR/skos-reference/", checked: "2026-11-05"}
  - id: sql
    kind: abbreviation
    en: {short: "SQL", full: "Structured Query Language", definition: "The standard language for defining, querying and changing the data of a relational database."}
    fr: {short: "SQL", full: "Structured Query Language", definition: "Langage normalisé qui sert à définir, à interroger et à modifier les données d'une base de données relationnelle."}
    source: {name: "ISO/IEC 9075-1, Information technology, Database languages SQL, Part 1: Framework (no GDT record found; TERMIUM Plus could not be read)", url: "https://www.iso.org/standard/76583.html", checked: "2026-11-07"}
  - id: ssdf
    kind: abbreviation
    en: {short: "SSDF", full: "Secure Software Development Framework", definition: "A NIST framework of practices that lower the number and the impact of vulnerabilities in software."}
    fr: {short: "SSDF", full: "Secure Software Development Framework", definition: "Cadre du NIST qui regroupe des pratiques pour réduire le nombre et l'impact des vulnérabilités des logiciels."}
    source: {name: "NIST SP 800-218, version 1.1 (no GDT record found; TERMIUM Plus could not be read)", url: "https://csrc.nist.gov/pubs/sp/800/218/final", checked: "2026-11-08"}
  - id: ssh
    kind: abbreviation
    en: {short: "SSH", full: "Secure Shell", definition: "A protocol for logging in to and working on a remote computer over an encrypted connection."}
    fr: {short: "SSH", full: "protocole SSH (Secure Shell)", definition: "Protocole qui permet de se connecter à un ordinateur distant et d'y travailler par une liaison chiffrée."}
    source: {name: "TERMIUM Plus", url: "https://www.btb.termiumplus.gc.ca/", checked: "2026-11-02"}
  - id: ste
    kind: abbreviation
    en: {short: "STE", full: "Simplified Technical English", definition: "A controlled form of English with limited words and rules, first written for aircraft maintenance texts."}
    fr: {short: "STE", full: "Simplified Technical English", definition: "Anglais contrôlé, au vocabulaire et aux règles limités, conçu d'abord pour la documentation de maintenance aéronautique."}
    source: {name: "ASD-STE100", url: "https://www.asd-ste100.org/", checked: "2026-11-02"}
  - id: svg
    kind: abbreviation
    en: {short: "SVG", full: "Scalable Vector Graphics", definition: "A W3C text format for vector images that stay sharp at any size."}
    fr: {short: "SVG", full: "format SVG (Scalable Vector Graphics)", definition: "Format texte du W3C pour des images vectorielles qui restent nettes à toute taille."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26508269/format-svg", checked: "2026-11-02"}
  - id: tbs
    kind: abbreviation
    en: {short: "TBS", full: "Treasury Board of Canada Secretariat", definition: "The federal central agency that sets Government of Canada management, digital and spending policy."}
    fr: {short: "SCT", full: "Secrétariat du Conseil du Trésor du Canada", definition: "Organisme central fédéral qui fixe les politiques de gestion, de numérique et de dépenses du gouvernement du Canada."}
    source: {name: "TERMIUM Plus", url: "https://www.btb.termiumplus.gc.ca/", checked: "2026-11-02"}
  - id: tls
    kind: abbreviation
    en: {short: "TLS", full: "Transport Layer Security", definition: "The protocol that encrypts a network connection and proves the identity of the server."}
    fr: {short: "TLS", full: "protocole TLS (Transport Layer Security)", definition: "Protocole qui chiffre une connexion réseau et prouve l'identité du serveur."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26558099/protocole-tls", checked: "2026-11-03"}
  - id: ui
    kind: abbreviation
    en: {short: "UI", full: "user interface", definition: "The screens, controls and messages through which a person uses a system."}
    fr: {short: "IU", full: "interface utilisateur", definition: "Écrans, commandes et messages par lesquels une personne utilise un système."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8374563/interface-utilisateur", checked: "2026-11-02"}
  - id: uml
    kind: abbreviation
    en: {short: "UML", full: "Unified Modeling Language", definition: "An Object Management Group language for modeling the structure and behavior of software systems in diagrams."}
    fr: {short: "UML", full: "langage de modélisation UML", definition: "Langage de l'Object Management Group qui sert à modéliser la structure et le comportement des systèmes logiciels au moyen de diagrammes."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8393306/langage-uml", checked: "2026-11-05"}
  - id: uri
    kind: abbreviation
    en: {short: "URI", full: "uniform resource identifier", definition: "A standard text string that names a resource, by its location or by a lasting name."}
    fr: {short: "URI", full: "adresse URI (uniform resource identifier)", definition: "Chaîne de caractères normalisée qui désigne une ressource, par son emplacement ou par un nom durable."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26520166/adresse-uri", checked: "2026-11-03"}
  - id: url
    kind: abbreviation
    en: {short: "URL", full: "uniform resource locator", definition: "A standard text string that names a resource on a network and says how to reach it."}
    fr: {short: "URL", full: "adresse URL (uniform resource locator)", definition: "Chaîne de caractères normalisée qui désigne une ressource sur un réseau et indique comment y accéder."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8869606/adresse-url", checked: "2026-11-02"}
  - id: utc
    kind: abbreviation
    en: {short: "UTC", full: "Coordinated Universal Time", definition: "The world reference time scale, kept by atomic clocks, from which each time zone is an offset."}
    fr: {short: "UTC", full: "temps universel coordonné", definition: "Échelle de temps de référence mondiale, tenue par des horloges atomiques, dont chaque fuseau horaire est un décalage."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8420561/temps-universel-coordonne", checked: "2026-11-03"}
  - id: utf-8
    kind: abbreviation
    en: {short: "UTF-8", full: "Unicode Transformation Format, 8-bit", definition: "The encoding that writes each Unicode character as one to four bytes."}
    fr: {short: "UTF-8", full: "Unicode Transformation Format, 8-bit", definition: "Codage qui écrit chaque caractère Unicode sur un à quatre octets."}
    source: {name: "Unicode Glossary (no GDT record found; TERMIUM Plus not checked)", url: "https://www.unicode.org/glossary/#UTF_8", checked: "2026-11-04"}
  - id: uuid
    kind: abbreviation
    en: {short: "UUID", full: "universally unique identifier", definition: "A 128-bit identifier that any system can create without a central registry, with a very low chance of a duplicate."}
    fr: {short: "UUID", full: "universally unique identifier", definition: "Identifiant de 128 bits que tout système peut créer sans registre central, avec un risque très faible de doublon."}
    source: {name: "RFC 9562", url: "https://www.rfc-editor.org/rfc/rfc9562", checked: "2026-11-03"}
  - id: w3c
    kind: abbreviation
    en: {short: "W3C", full: "World Wide Web Consortium", definition: "The international organization that develops open standards for the Web."}
    fr: {short: "W3C", full: "World Wide Web Consortium", definition: "Organisme international qui élabore les normes ouvertes du Web."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8393113/consortium-w3c", checked: "2026-11-02"}
  - id: wcag
    kind: abbreviation
    en: {short: "WCAG", full: "Web Content Accessibility Guidelines", definition: "W3C guidelines that say how to make web content usable by people with disabilities."}
    fr: {short: "WCAG", full: "Règles pour l'accessibilité des contenus web", definition: "Lignes directrices du W3C qui indiquent comment rendre les contenus web utilisables par les personnes handicapées."}
    source: {name: "W3C", url: "https://www.w3.org/Translations/WCAG22-fr-20260922/", checked: "2026-11-02"}
  - id: wgs-84
    kind: abbreviation
    en: {short: "WGS 84", full: "World Geodetic System 1984", definition: "The global reference system for latitude, longitude and height that GPS and most web maps use."}
    fr: {short: "WGS 84", full: "système géodésique mondial 1984", definition: "Système de référence mondial de la latitude, de la longitude et de l'altitude qu'emploient le GPS et la plupart des cartes Web."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26518025/systeme-geodesique-mondial", checked: "2026-11-03"}
  - id: xliff
    kind: abbreviation
    en: {short: "XLIFF", full: "XML Localization Interchange File Format", definition: "The OASIS standard file format for passing text to translate, and its translations, between tools."}
    fr: {short: "XLIFF", full: "format XLIFF (XML Localization Interchange File Format)", definition: "Format de fichier normalisé par OASIS pour échanger entre outils le texte à traduire et ses traductions."}
    source: {name: "OASIS, XLIFF Version 2.1", url: "https://docs.oasis-open.org/xliff/xliff-core/v2.1/os/xliff-core-v2.1-os.html", checked: "2026-11-04"}
  - id: asset
    kind: term
    en: {full: "asset", definition: "A thing or right that can be owned, and whose ownership a registry records."}
    fr: {full: "bien", definition: "Chose ou droit qui peut appartenir à quelqu'un et dont un registre consigne la propriété."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/2077909/bien", checked: "2026-11-02"}
  - id: branch
    kind: term
    en: {full: "branch", definition: "A separate line of development in a repository that can later be merged back."}
    fr: {full: "branche", definition: "Ligne de développement distincte dans un dépôt, qui peut ensuite être fusionnée."}
    source: {name: "TERMIUM Plus", url: "https://www.btb.termiumplus.gc.ca/", checked: "2026-11-02"}
  - id: commit
    kind: term
    en: {full: "commit", definition: "A recorded, identified set of changes saved to a repository's history."}
    fr: {full: "archivage", definition: "Ensemble identifié de modifications enregistré dans l'historique d'un dépôt."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8356425/archivage", checked: "2026-11-02"}
  - id: entitlement
    kind: term
    en: {full: "entitlement", definition: "A specific right a party holds over an asset, such as a license or a permit."}
    fr: {full: "droit", definition: "Droit précis qu'une partie détient sur un bien, comme une licence ou un permis."}
    source: {name: "TERMIUM Plus", url: "https://www.btb.termiumplus.gc.ca/", checked: "2026-11-02"}
  - id: jurisdiction
    kind: term
    en: {full: "jurisdiction", definition: "A government area, such as a country, province or municipality, with its own laws and rules."}
    fr: {full: "collectivité publique", definition: "Entité publique territoriale, comme un pays, une province ou une municipalité, qui a ses propres lois et règles."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8378880/collectivite-publique", checked: "2026-11-02"}
  - id: locale
    kind: term
    en: {full: "locale", definition: "A language together with the conventions of a region for dates, numbers, sorting and similar items."}
    fr: {full: "paramètre régional", definition: "Langue associée aux conventions d'une région pour les dates, les nombres, le tri et d'autres éléments semblables."}
    source: {name: "TERMIUM Plus", url: "https://www.btb.termiumplus.gc.ca/tpv2alpha/alpha-eng.html?lang=eng&srchtxt=locale", checked: "2026-11-04"}
  - id: ownership
    kind: term
    en: {full: "ownership", definition: "The fullest right a party can hold over an asset, within the limits of the law."}
    fr: {full: "propriété", definition: "Droit le plus complet qu'une partie peut détenir sur un bien, dans les limites de la loi."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8365758/droit-de-propriete", checked: "2026-11-02"}
  - id: party
    kind: term
    en: {full: "party", definition: "A person or an organization that a system records, such as one that holds rights or duties in a registry."}
    fr: {full: "partie", definition: "Personne ou organisation qu'un système enregistre, comme celle qui détient des droits ou des obligations inscrits dans un registre."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26550268/partie", checked: "2026-11-02"}
  - id: registry
    kind: term
    en: {full: "registry", definition: "An official, lasting record of facts, such as who holds which rights over what."}
    fr: {full: "registre", definition: "Recueil officiel et durable de faits, par exemple qui détient quels droits sur quoi."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8355393/registre-public", checked: "2026-11-02"}
  - id: repository
    kind: term
    en: {full: "repository", definition: "A store of a project's files and their full history of changes."}
    fr: {full: "dépôt", definition: "Espace où sont conservés les fichiers d'un projet et l'historique complet de leurs modifications."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26584236/depot-de-code-source", checked: "2026-11-02"}
  - id: requirement
    kind: term
    en: {full: "requirement", definition: "A statement in a specification that a conforming product or process must satisfy."}
    fr: {full: "exigence", definition: "Énoncé d'une spécification qu'un produit ou un processus conforme doit respecter."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8871085/exigence", checked: "2026-11-02"}
  - id: test-double
    kind: term
    en: {full: "test double", definition: "A component that stands in for a real dependency during a test, such as a component that returns fixed answers."}
    fr: {full: "doublure de test", definition: "Composant qui remplace une dépendance réelle pendant un test, par exemple un composant qui renvoie des réponses fixes."}
    source: {name: "ISTQB Glossary 4.8.1, test double (no GDT record found)", url: "https://glossary.istqb.org/en_US/term/test-double", checked: "2026-11-08"}
  - id: vulnerability
    kind: term
    en: {full: "vulnerability", definition: "A weakness in software or in a specification that an attacker can exploit to harm its security."}
    fr: {full: "vulnérabilité", definition: "Faiblesse d'un logiciel ou d'une spécification qu'un attaquant peut exploiter pour nuire à sa sécurité."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26578865/vulnerabilite", checked: "2026-11-08"}
  - id: xml
    kind: abbreviation
    en: {short: "XML", full: "Extensible Markup Language", definition: "The W3C text format that marks up structured data with nested, named elements."}
    fr: {short: "XML", full: "Extensible Markup Language", definition: "Format texte du W3C qui balise des données structurées au moyen d'éléments nommés et imbriqués."}
    source: {name: "W3C, Extensible Markup Language (XML) 1.0 (Fifth Edition) (no GDT record found; TERMIUM Plus could not be read)", url: "https://www.w3.org/TR/xml/", checked: "2026-11-07"}
