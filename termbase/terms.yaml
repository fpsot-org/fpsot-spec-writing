    en: {short: "UI", full: "user interface", definition: "The screens, controls and messages through which a person uses a system."}
    fr: {short: "IU", full: "interface utilisateur", definition: "Écrans, commandes et messages par lesquels une personne utilise un système."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8374563/interface-utilisateur", checked: "2026-11-02"}
  - id: uml
    kind: abbreviation
    en: {short: "UML", full: "Unified Modeling Language", definition: "An Object Management Group language for modeling the structure and behavior of software systems in diagrams."}
    fr: {short: "UML", full: "langage de modélisation UML", definition: "Langage de l'Object Management Group qui sert à modéliser la structure et le comportement des systèmes logiciels au moyen de diagrammes."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8393306/langage-uml", checked: "2026-11-05"}
  - id: uri
    kind: abbreviation
    en: {short: "URI", full: "uniform resource identifier", definition: "A standard text string that names a resource, by its location or by a lasting name."}
    fr: {short: "URI", full: "adresse URI (uniform resource identifier)", definition: "Chaîne de caractères normalisée qui désigne une ressource, par son emplacement ou par un nom durable."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26520166/adresse-uri", checked: "2026-11-03"}
  - id: url
    kind: abbreviation
    en: {short: "URL", full: "uniform resource locator", definition: "A standard text string that names a resource on a network and says how to reach it."}
    fr: {short: "URL", full: "adresse URL (uniform resource locator)", definition: "Chaîne de caractères normalisée qui désigne une ressource sur un réseau et indique comment y accéder."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8869606/adresse-url", checked: "2026-11-02"}
  - id: utc
    kind: abbreviation
    en: {short: "UTC", full: "Coordinated Universal Time", definition: "The world reference time scale, kept by atomic clocks, from which each time zone is an offset."}
    fr: {short: "UTC", full: "temps universel coordonné", definition: "Échelle de temps de référence mondiale, tenue par des horloges atomiques, dont chaque fuseau horaire est un décalage."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8420561/temps-universel-coordonne", checked: "2026-11-03"}
  - id: utf-8
    kind: abbreviation
    en: {short: "UTF-8", full: "Unicode Transformation Format, 8-bit", definition: "The encoding that writes each Unicode character as one to four bytes."}
    fr: {short: "UTF-8", full: "Unicode Transformation Format, 8-bit", definition: "Codage qui écrit chaque caractère Unicode sur un à quatre octets."}
    source: {name: "Unicode Glossary (no GDT record found; TERMIUM Plus not checked)", url: "https://www.unicode.org/glossary/#UTF_8", checked: "2026-11-04"}
  - id: uuid
    kind: abbreviation
    en: {short: "UUID", full: "universally unique identifier", definition: "A 128-bit identifier that any system can create without a central registry, with a very low chance of a duplicate."}
    fr: {short: "UUID", full: "universally unique identifier", definition: "Identifiant de 128 bits que tout système peut créer sans registre central, avec un risque très faible de doublon."}
    source: {name: "RFC 9562", url: "https://www.rfc-editor.org/rfc/rfc9562", checked: "2026-11-03"}
  - id: w3c
    kind: abbreviation
    en: {short: "W3C", full: "World Wide Web Consortium", definition: "The international organization that develops open standards for the Web."}
    fr: {short: "W3C", full: "World Wide Web Consortium", definition: "Organisme international qui élabore les normes ouvertes du Web."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8393113/consortium-w3c", checked: "2026-11-02"}
  - id: wcag
    kind: abbreviation
    en: {short: "WCAG", full: "Web Content Accessibility Guidelines", definition: "W3C guidelines that say how to make web content usable by people with disabilities."}
    fr: {short: "WCAG", full: "Règles pour l'accessibilité des contenus web", definition: "Lignes directrices du W3C qui indiquent comment rendre les contenus web utilisables par les personnes handicapées."}
    source: {name: "W3C", url: "https://www.w3.org/Translations/WCAG22-fr-20260922/", checked: "2026-11-02"}
  - id: wgs-84
    kind: abbreviation
    en: {short: "WGS 84", full: "World Geodetic System 1984", definition: "The global reference system for latitude, longitude and height that GPS and most web maps use."}
    fr: {short: "WGS 84", full: "système géodésique mondial 1984", definition: "Système de référence mondial de la latitude, de la longitude et de l'altitude qu'emploient le GPS et la plupart des cartes Web."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26518025/systeme-geodesique-mondial", checked: "2026-11-03"}
  - id: xliff
    kind: abbreviation
    en: {short: "XLIFF", full: "XML Localization Interchange File Format", definition: "The OASIS standard file format for passing text to translate, and its translations, between tools."}
    fr: {short: "XLIFF", full: "format XLIFF (XML Localization Interchange File Format)", definition: "Format de fichier normalisé par OASIS pour échanger entre outils le texte à traduire et ses traductions."}
    source: {name: "OASIS, XLIFF Version 2.1", url: "https://docs.oasis-open.org/xliff/xliff-core/v2.1/os/xliff-core-v2.1-os.html", checked: "2026-11-04"}
  - id: access-policy
    kind: term
    en: {full: "access policy", definition: "A grant in a profile that lets a category of recipients see more than the public, with its legal basis, purpose, expiry and duty to log."}
    fr: {full: "politique d’accès", definition: "Autorisation d’un profil qui permet à une catégorie de destinataires de voir plus que le public, avec sa base juridique, sa fin, son échéance et son obligation de journaliser."}
    source: {name: "FPSOT registry specification, REG-074; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: access-token
    kind: term
    en: {full: "access token", definition: "A credential that an authorization server issues to a client, so that the client can call an API within set limits."}
    fr: {full: "jeton d'accès", definition: "Justificatif qu'un serveur d'autorisation remet à un client, pour que celui-ci appelle une API dans des limites fixées."}
    source: {name: "IETF RFC 6749 (English); no GDT or TERMIUM Plus record found, French as used in Canadian French technical documentation", url: "https://www.rfc-editor.org/info/rfc6749", checked: "2026-11-10"}
  - id: acknowledgment
    kind: term
    en: {full: "acknowledgment of receipt", definition: "The message that a public body sends for each submission, with the reference number, the received time, the body that handles it and what comes next."}
    fr: {full: "accusé de réception", definition: "Message qu’un organisme public envoie pour chaque dépôt, avec le numéro de référence, l’heure de réception, l’organisme qui le traite et la suite."}
    source: {name: "Loi concernant le cadre juridique des technologies de l'information, RLRQ, c. C-1.1, articles 28 and 31 (official French form)", url: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/C-1.1", checked: "2026-11-23"}
  - id: acquirer
    kind: term
    en: {full: "acquirer", definition: "The financial institution that accepts card payments for a merchant and settles them."}
    fr: {full: "acquéreur", definition: "Institution financière qui accepte les paiements par carte pour un marchand et les règle."}
    source: {name: "FPSOT fees specification, FEE-048; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: acting-party
    kind: term
    en: {full: "acting party", definition: "The party who does an act on an application file, recorded apart from the party whose file it is."}
    fr: {full: "partie agissante", definition: "Partie qui fait un acte sur un dossier de demande, consignée séparément de la partie à qui appartient le dossier."}
    source: {name: "FPSOT applications specification, APP-071; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: algorithmic-impact-assessment
    kind: term
    en: {full: "Algorithmic Impact Assessment", definition: "The questionnaire of the Government of Canada that scores an automated decision system and gives its impact level."}
    fr: {full: "Évaluation de l'incidence algorithmique", definition: "Questionnaire du gouvernement du Canada qui note un système décisionnel automatisé et en donne le niveau d'incidence."}
    source: {name: "Treasury Board of Canada Secretariat, Algorithmic Impact Assessment tool, French version to confirm", url: "https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/responsible-use-ai/algorithmic-impact-assessment.html", checked: "2026-11-15"}
  - id: applicant
    kind: term
    en: {full: "applicant", definition: "The party that an application is about and that applies, alone or through a representative."}
    fr: {full: "personne requérante", definition: "Partie que vise une demande et qui la présente, seule ou par une personne qui la représente."}
    source: {name: "FPSOT applications specification, APP-001; French form approved by the lead on 2026-11-26", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: application
    kind: term
    en: {full: "application", definition: "A request to a public body for a decision about one party, such as a permit, a license, a benefit or a grant."}
    fr: {full: "demande", definition: "Requête adressée à un organisme public pour obtenir une décision sur une partie, comme un permis, une licence, une prestation ou une subvention."}
    source: {name: "Loi sur la justice administrative, RLRQ, c. J-3, articles 4 to 6 (French form of the act); French form approved by the lead on 2026-11-26", url: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/J-3", checked: "2026-11-23"}
  - id: application-file
    kind: term
    en: {full: "application file", definition: "The record of one application from its first draft to its end, with its states, its versions and the acts on it, whatever its channel."}
    fr: {full: "dossier de demande", definition: "Donnée d’une demande, de son premier brouillon jusqu’à sa fin, avec ses états, ses versions et les actes faits sur elle, quel que soit son canal."}
    source: {name: "FPSOT applications specification, APP-030; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: asset
    kind: term
    en: {full: "asset", definition: "A thing that a register identifies, such as a vessel, a vehicle, a drone or a firearm."}
    fr: {full: "bien", definition: "Chose qu’un registre identifie, comme un bateau, un véhicule, un drone ou une arme."}
    source: {name: "Changed definition proposed by the FPSOT registry specification, REG-050; same French form", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: authorization-engine
    kind: term
    en: {full: "authorization engine", definition: "A service that decides whether a subject may take an action on a resource, from policies and relationships, and returns the decision to the service that asks."}
    fr: {full: "moteur d'autorisation", definition: "Service qui décide si un sujet peut faire une action sur une ressource, à partir de politiques et de relations, et qui rend la décision au service qui la demande."}
    source: {name: "OpenID AuthZEN Authorization API 1.0 (policy decision point; English); no GDT or TERMIUM Plus record found, French built on the GDT term autorisation", url: "https://openid.net/specs/authorization-api-1_0-final.html", checked: "2026-11-10"}
  - id: beneficial-owner
    kind: term
    en: {full: "beneficial owner", definition: "A person who in the end owns or controls a business, as a register of beneficial owners records them."}
    fr: {full: "bénéficiaire effectif", definition: "Personne qui, au bout du compte, possède ou contrôle une entreprise, telle qu’un registre des bénéficiaires l’inscrit."}
    source: {name: "French law uses bénéficiaire effectif; Québec uses bénéficiaire ultime. Both to confirm", url: "https://www.quebec.ca/entreprises-et-travailleurs-autonomes/demarrer-entreprise/immatriculer-constituer-entreprise/nouvelles-obligations-transparence", checked: "2026-11-18"}
  - id: branch
    kind: term
    en: {full: "branch", definition: "A separate line of development in a repository that can later be merged back."}
    fr: {full: "branche", definition: "Ligne de développement distincte dans un dépôt, qui peut ensuite être fusionnée."}
    source: {name: "TERMIUM Plus", url: "https://www.btb.termiumplus.gc.ca/", checked: "2026-11-02"}
  - id: card-data
    kind: term
    en: {full: "card data", definition: "The card number, the security code, the expiry date, the track data and the PIN of a payment card."}
    fr: {full: "données de carte", definition: "Numéro, code de sécurité, date d’expiration, données de piste et NIP d’une carte de paiement."}
    source: {name: "FPSOT fees specification, FEE-046; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: case
    kind: term
    en: {full: "case", definition: "The matter that a body works on after an application, which a later case specification will hold."}
    fr: {full: "affaire", definition: "Ce que traite un organisme à la suite d’une demande, que contiendra une future spécification sur le traitement des affaires."}
    source: {name: "FPSOT applications specification, APP-032; French form approved by the lead on 2026-11-26", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: checkpoint
    kind: term
    en: {full: "checkpoint", definition: "A short signed statement of the size and the root hash of a transparency log at one moment."}
    fr: {full: "point de contrôle", definition: "Court énoncé signé de la taille et du condensé racine d'un journal de transparence à un moment donné."}
    source: {name: "C2SP tlog-checkpoint v1.1.0; the French form follows fpsot-spec-observability (no GDT record found for this sense)", url: "https://github.com/C2SP/C2SP/blob/b2dd9892338af7009733a4575a6da05811ffae6c/tlog-checkpoint.md", checked: "2026-11-11"}
  - id: clause-module
    kind: term
    en: {full: "clause module", definition: "One block of draft clause text that a buyer pastes into a tender as a whole, with a drafting note, a version and fields to fill in."}
    fr: {full: "module de clauses", definition: "Bloc de clauses types qu'une organisation acheteuse insère tel quel dans un appel d'offres, avec une note de rédaction, une version et des champs à remplir."}
    source: {name: "FPSOT wording (no GDT record checked)", url: "https://github.com/fpsot-org/fpsot-spec-procurement", checked: "2026-11-08"}
  - id: clause-pack
    kind: term
    en: {full: "clause pack", definition: "The set of clause modules that serve one release of one FPSOT specification."}
    fr: {full: "trousse de clauses", definition: "Ensemble des modules de clauses qui servent une version d'une spécification de la FPSOT."}
    source: {name: "FPSOT wording (no GDT record checked)", url: "https://github.com/fpsot-org/fpsot-spec-procurement", checked: "2026-11-08"}
  - id: cliff-edge
    kind: term
    en: {full: "cliff edge", definition: "A rule under which a small change in one fact removes a whole benefit."}
    fr: {full: "effet de seuil", definition: "Règle selon laquelle un faible changement d'un fait supprime toute une prestation."}
    source: {name: "FPSOT decisions specification, DEC-027; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: clock
    kind: term
    en: {full: "clock", definition: "A period that runs on an application file, such as a service standard or a statutory time limit, which a request can start or suspend."}
    fr: {full: "décompte", definition: "Période qui court sur un dossier de demande, comme une norme de service ou un délai légal, qu’une demande de renseignements peut faire partir ou suspendre."}
    source: {name: "FPSOT applications specification, APP-054; French form approved by the lead on 2026-11-26", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: commit
    kind: term
    en: {full: "commit", definition: "A recorded, identified set of changes saved to a repository's history."}
    fr: {full: "archivage", definition: "Ensemble identifié de modifications enregistré dans l'historique d'un dépôt."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8356425/archivage", checked: "2026-11-02"}
  - id: commitment
    kind: term
    en: {full: "commitment", definition: "The salted hash of a sealed filing, which is its entry in the transparency log."}
    fr: {full: "condensé salé", definition: "Condensé salé d’une déclaration cachetée, qui est son entrée dans le journal de transparence."}
    source: {name: "FPSOT registry specification, REG-031, after LOG-031; French form as in the signed records specification, to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: conformance-class
    kind: term
    en: {full: "conformance class", definition: "A named set of requirements of a specification that a product or document can meet as a whole."}
    fr: {full: "classe de conformité", definition: "Ensemble nommé d'exigences d'une spécification qu'un produit ou un document peut respecter comme un tout."}
    source: {name: "FPSOT wording, after the conformance classes of the api-restful and style specifications (no GDT record checked)", url: "https://github.com/fpsot-org/fpsot-spec-api-restful", checked: "2026-11-08"}
  - id: conformance-statement
    kind: term
    en: {full: "conformance statement", definition: "A bidder's structured declaration that says, for each required conformance class, whether its solution meets it."}
    fr: {full: "déclaration de conformité", definition: "Déclaration structurée d'une entreprise soumissionnaire qui indique, pour chaque classe de conformité exigée, si sa solution la respecte."}
    source: {name: "FPSOT wording (no GDT record checked)", url: "https://github.com/fpsot-org/fpsot-spec-procurement", checked: "2026-11-08"}
  - id: content-security-policy
    kind: term
    en: {full: "content security policy", definition: "A response header that tells the browser which sources of scripts, styles and other content a page may use."}
    fr: {full: "politique de sécurité du contenu", definition: "En-tête de réponse qui indique au navigateur les sources de scripts, de styles et d’autres contenus qu’une page peut employer."}
    source: {name: "MDN Web Docs, CSP: script-src; French form to confirm", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src", checked: "2026-11-18"}
  - id: core-engine
    kind: term
    en: {full: "core engine", definition: "Software that keeps filings and derives the state of registers of any domain, under the rules of this specification."}
    fr: {full: "moteur de base", definition: "Logiciel qui tient les déclarations et dérive l’état de registres de tout domaine, selon les règles de cette spécification."}
    source: {name: "FPSOT registry specification, REG-002; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: counterfactual-value
    kind: term
    en: {full: "counterfactual value", definition: "The exact value of a factor at which a reason would stop applying, with the other facts unchanged."}
    fr: {full: "valeur contrefactuelle", definition: "Valeur exacte d'un facteur à laquelle un motif cesserait de s'appliquer, les autres faits restant les mêmes."}
    source: {name: "Wachter, Mittelstadt and Russell, Counterfactual Explanations without Opening the Black Box; French form to confirm", url: "https://arxiv.org/abs/1711.00399v2", checked: "2026-11-15"}
  - id: date-stamp
    kind: term
    en: {full: "date stamp", definition: "The mark that a body puts on a paper document when it arrives, which may hold a date only, or a time to the minute."}
    fr: {full: "tampon dateur", definition: "Marque qu’un organisme appose sur un document papier à son arrivée, qui peut ne porter qu’une date, ou une heure à la minute."}
    source: {name: "FPSOT applications specification, APP-041 and APP-092; French form approved by the lead on 2026-11-26", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: dated-parameter
    kind: term
    en: {full: "dated parameter", definition: "An amount, a rate or a threshold whose value changes over time, kept in a data file with the period and the legal source of each value."}
    fr: {full: "paramètre daté", definition: "Montant, taux ou seuil dont la valeur change au fil du temps, conservé dans un fichier de données avec la période et la source juridique de chaque valeur."}
    source: {name: "OpenFisca, Legislation parameters, for the concept; French form to confirm", url: "https://openfisca.org/doc/coding-the-legislation/legislation_parameters.html", checked: "2026-11-15"}
  - id: decision-contract
    kind: term
    en: {full: "decision contract", definition: "The interface between a decision service and the rules of one decision type: an input, an evaluation context and a result of one of four kinds."}
    fr: {full: "contrat de décision", definition: "Interface entre un service de décision et les règles d'un type de décision : une entrée, un contexte d'évaluation et un résultat d'un des quatre types."}
    source: {name: "FPSOT decisions specification, DEC-020; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: decision-record
    kind: term
    en: {full: "decision record", definition: "The append-only record of one result of a decision, made of codes, values and references, never of prose."}
    fr: {full: "enregistrement de décision", definition: "Enregistrement en ajout seul d'un résultat de décision, fait de codes, de valeurs et de références, jamais de texte rédigé."}
    source: {name: "FPSOT decisions specification, DEC-040; French form to confirm (GDT gives enregistrement for a data record)", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: decision-service
    kind: term
    en: {full: "decision service", definition: "Software that runs a rule provider, applies the controls of the profiles and keeps the decision records."}
    fr: {full: "service de décision", definition: "Logiciel qui exécute un fournisseur de règles, applique les contrôles des profils et tient les enregistrements de décision."}
    source: {name: "FPSOT decisions specification, DEC-002; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: decision-type
    kind: term
    en: {full: "decision type", definition: "A kind of individual decision that a public body makes under one legal authority, such as eligibility for one benefit."}
    fr: {full: "type de décision", definition: "Catégorie de décisions individuelles qu'un organisme public prend en vertu d'un même pouvoir légal, comme l'admissibilité à une prestation."}
    source: {name: "FPSOT decisions specification, DEC-010; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: degree-of-automation
    kind: term
    en: {full: "degree of automation", definition: "How much a person took part in a decision, derived from its review steps: fully automated, confirmed by a person or decided by a person."}
    fr: {full: "degré d'automatisation", definition: "Mesure de la participation d'une personne à une décision, tirée de ses étapes de révision : entièrement automatisée, confirmée par une personne ou décidée par une personne."}
    source: {name: "FPSOT decisions specification, DEC-060; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: deploying-body
    kind: term
    en: {full: "deploying body", definition: "The public body that answers for a system that it runs, such as the decisions of a decision type or the payments of its fees."}
    fr: {full: "organisme responsable", definition: "Organisme public qui répond d’un système qu’il exploite, comme les décisions d’un type de décision ou les paiements de ses frais."}
    source: {name: "Broader definition proposed by the FPSOT fees specification, FEE-002 and FEE-082, to replace the one of the decisions specification; same French form", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: derived-state
    kind: term
    en: {full: "derived state", definition: "The state of a register that a replay of its completed filings gives, as of one instant and as recorded at another."}
    fr: {full: "état dérivé", definition: "État d’un registre que donne le rejeu de ses déclarations achevées, à un instant donné, tel qu’enregistré à un autre."}
    source: {name: "FPSOT registry specification, REG-040; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: destruction-filing
    kind: term
    en: {full: "destruction filing", definition: "A filing that destroys the content and the salt of every earlier filing that holds a value that a law or an order targets, and leaves tombstones."}
    fr: {full: "déclaration de destruction", definition: "Déclaration qui détruit le contenu et le sel de déclarations antérieures en vertu d’une loi ou d’une ordonnance, et laisse des traces de destruction."}
    source: {name: "FPSOT registry specification, REG-093; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: dispute
    kind: term
    en: {full: "dispute", definition: "A challenge of a card payment that the bank of the payer opens, which can take the payment back from the body."}
    fr: {full: "contestation", definition: "Remise en cause d’un paiement par carte que la banque de la personne ouvre, et qui peut reprendre le paiement à l’organisme."}
    source: {name: "FPSOT fees specification, FEE-067, after GOV.UK Pay; French form to confirm. A lost dispute is a rétrofacturation (chargeback)", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: domain-pack
    kind: term
    en: {full: "domain pack", definition: "The released data and schema of one domain of registers, such as pleasure craft: asset classes, identifier schemes, filing types and lifecycles."}
    fr: {full: "module de domaine", definition: "Données et schéma publiés d’un domaine de registres, comme les embarcations de plaisance : classes de biens, schémas d’identifiants, types de déclarations et cycles de vie."}
    source: {name: "FPSOT registry specification, REG-100; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: dual-review
    kind: term
    en: {full: "dual review", definition: "A control under which two different people must each complete a review step before a final decision."}
    fr: {full: "double révision", definition: "Contrôle selon lequel deux personnes différentes doivent chacune réaliser une étape de révision avant une décision finale."}
    source: {name: "FPSOT decisions specification, DEC-064; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: effective-date
    kind: term
    en: {full: "effective date", definition: "The date whose law applies to a case, such as the date of an application."}
    fr: {full: "date d'effet", definition: "Date dont le droit s'applique à un dossier, comme la date d'une demande."}
    source: {name: "FPSOT decisions specification, DEC-022; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: embedded-payment-form
    kind: term
    en: {full: "embedded payment form", definition: "A payment form of the provider that a page of the body embeds, such as in a frame."}
    fr: {full: "formulaire de paiement intégré", definition: "Formulaire de paiement du fournisseur qu’une page de l’organisme intègre, comme dans un cadre."}
    source: {name: "FPSOT fees specification, FEE-048; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: encumbrance
    kind: term
    en: {full: "encumbrance", definition: "A lien, a seizure, a stop order or a flag that weighs on an asset or on an entitlement."}
    fr: {full: "charge", definition: "Sûreté, saisie, interdiction ou signalement qui grève un bien ou un droit."}
    source: {name: "TERMIUM Plus, encumbrance, for the French form, to confirm. A sûreté is only one kind of charge, and a Québec hypothèque only one kind of sûreté", url: "https://www.btb.termiumplus.gc.ca/", checked: "2026-11-18"}
  - id: engagement-evidence
    kind: term
    en: {full: "engagement evidence", definition: "Facts that show how a reviewer engaged with a record, such as what they opened and for how long."}
    fr: {full: "preuves d'examen", definition: "Faits qui montrent comment une personne qui révise a examiné un enregistrement, comme ce qu'elle a ouvert et pendant combien de temps."}
    source: {name: "FPSOT decisions specification, DEC-065; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: entitlement
    kind: term
    en: {full: "entitlement", definition: "A right that a register grants to parties, such as a license, a permit or a registration, which may cover assets or none."}
    fr: {full: "droit", definition: "Droit qu’un registre accorde à des parties, comme un permis, une autorisation ou une immatriculation, qui peut viser des biens ou aucun."}
    source: {name: "Changed definition proposed by the FPSOT registry specification, REG-056 and REG-057; French form ambiguous, see decision 3", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: evidence-record
    kind: term
    en: {full: "evidence record", definition: "A structure of hash trees and time stamps that proves that data existed unchanged since a given time, and that one renews before its algorithms weaken."}
    fr: {full: "dossier de preuves", definition: "Structure d'arbres de hachage et d'horodatages qui prouve que des données existent sans changement depuis un moment donné, et qu'on renouvelle avant que ses algorithmes ne faiblissent."}
    source: {name: "RFC 4998, Evidence Record Syntax; French form set by the FPSOT French review of 2026-11-11 (no GDT record found)", url: "https://www.rfc-editor.org/info/rfc4998", checked: "2026-11-11"}
  - id: extract
    kind: term
    en: {full: "extract", definition: "A sealed record of what a register shows about a subject, as of one instant and as recorded at another."}
    fr: {full: "extrait", definition: "Document cacheté de ce qu’un registre montre sur un sujet, à un instant donné, tel qu’enregistré à un autre."}
    source: {name: "FPSOT registry specification, REG-084; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: fee
    kind: term
    en: {full: "fee", definition: "An amount that a public body charges under a law for a service, a right, a document or the use of a facility."}
    fr: {full: "frais", definition: "Somme qu’un organisme public exige en vertu d’une loi pour un service, un droit, un document ou l’usage d’une installation."}
    source: {name: "Service Fees Act and Loi sur les frais de service, title and section 2 (official French form; the French definition is to confirm)", url: "https://laws-lois.justice.gc.ca/fra/lois/S-8.4/TexteComplet.html", checked: "2026-11-21"}
  - id: fee-engine
    kind: term
    en: {full: "fee engine", definition: "Software that quotes fees, takes payments, refunds, remits and issues receipts, under the rules of the fees specification."}
    fr: {full: "moteur de frais", definition: "Logiciel qui établit des devis, reçoit des paiements, rembourse, remet et délivre des reçus, selon les règles de la spécification sur les frais."}
    source: {name: "FPSOT fees specification, FEE-002; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: fee-exemption
    kind: term
    en: {full: "exemption", definition: "A rule of law under which a payer who meets a condition owes no fee, or a smaller one."}
    fr: {full: "exemption", definition: "Règle de droit selon laquelle une personne qui remplit une condition ne doit aucuns frais, ou des frais moindres."}
    source: {name: "FPSOT registry specification, REG-026 (same French form), and FEE-028; to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: fee-item
    kind: term
    en: {full: "fee item", definition: "One fee of a fee schedule, with its basis, the parameter of its amounts, its legal source and its exemptions."}
    fr: {full: "élément de frais", definition: "Frais particuliers d’un barème, avec leur base, le paramètre de leurs montants, leur source juridique et leurs exemptions."}
    source: {name: "FPSOT fees specification, FEE-020 and FEE-022; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: fee-order
    kind: term
    en: {full: "fee order", definition: "What a payer owes for one or more quotes, with the payment attempts against it."}
    fr: {full: "demande de paiement", definition: "Ce que doit une personne pour un ou plusieurs devis, avec les tentatives de paiement qui s’y rattachent."}
    source: {name: "FPSOT fees specification, FEE-040; French form approved by the lead on 2026-11-22", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: fee-quote
    kind: term
    en: {full: "fee quote", definition: "The lines of one fee decision: each fee, the value in force, any exemption and the taxes, with the total of the decision record."}
    fr: {full: "devis", definition: "Lignes d’une décision sur des frais : chacun des frais, la valeur en vigueur, l’exemption éventuelle et les taxes, avec le total de l’enregistrement de décision."}
    source: {name: "FPSOT fees specification, FEE-026 and FEE-027; French form approved by the lead on 2026-11-22", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: fee-schedule
    kind: term
    en: {full: "fee schedule", definition: "A dated parameter file that holds the fees of a body, each with its amounts over time, its legal source and its tax treatment."}
    fr: {full: "barème de frais", definition: "Fichier de paramètres datés qui contient les frais d’un organisme, chacun avec ses montants dans le temps, sa source juridique et son traitement fiscal."}
    source: {name: "FPSOT fees specification, FEE-020; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: file-version
    kind: term
    en: {full: "file version", definition: "One submitted state of an application file, with the answers and attachments sent at that time, which never changes."}
    fr: {full: "version du dossier", definition: "État déposé d’un dossier de demande, avec les réponses et les pièces jointes transmises à ce moment, qui ne change jamais."}
    source: {name: "FPSOT applications specification, APP-036 and APP-037; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: filing
    kind: term
    en: {full: "filing", definition: "One legal event in a register, such as an application, an act of the registrar, a correction, an order or a destruction, which never changes once received."}
    fr: {full: "déclaration", definition: "Événement juridique dans un registre, comme une demande, un acte du registraire, une correction, une ordonnance ou une destruction, qui ne change jamais une fois reçu."}
    source: {name: "FPSOT registry specification, REG-020 and REG-021; French form provisional, see decision 1 (the Québec enterprise registrar uses déclaration)", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: finding
    kind: term
    en: {full: "finding", definition: "One problem that a linter or an analyzer reports at one place in the code."}
    fr: {full: "constat", definition: "Problème qu’un analyseur signale à un endroit du code."}
    source: {name: "FPSOT code specification, COD-010; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-code", checked: "2026-11-18"}
  - id: form-definition
    kind: term
    en: {full: "form definition", definition: "One version of a form: its canonical address, its business version, its status, its questions and the JSON Schema that its answers meet."}
    fr: {full: "définition de formulaire", definition: "Version d’un formulaire : son adresse canonique, sa version métier, son statut, ses questions et le schéma JSON que respectent ses réponses."}
    source: {name: "FPSOT applications specification, APP-020, after the Questionnaire of HL7 FHIR R5; French form to confirm", url: "https://hl7.org/fhir/R5/questionnaire.html", checked: "2026-11-23"}
  - id: formatter
    kind: term
    en: {full: "formatter", definition: "A tool that rewrites source code into one fixed layout."}
    fr: {full: "outil de mise en forme", definition: "Outil qui réécrit le code source selon une mise en page fixe."}
    source: {name: "FPSOT code specification, COD-002; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-code", checked: "2026-11-18"}
  - id: framework
    kind: term
    en: {full: "framework", definition: "A body of code that calls the code of an application and gives it a structure, such as Quarkus."}
    fr: {full: "cadriciel", definition: "Ensemble de code qui appelle le code d’une application et lui donne une structure, comme Quarkus."}
    source: {name: "Office québécois de la langue française, cadriciel; to confirm", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/", checked: "2026-11-18"}
  - id: frozen-corpus
    kind: term
    en: {full: "frozen corpus", definition: "A set of test cases with expected results that nobody changes once its rule version is in force."}
    fr: {full: "corpus figé", definition: "Ensemble de cas d'essai avec leurs résultats attendus que personne ne modifie une fois sa version de règles en vigueur."}
    source: {name: "FPSOT decisions specification, DEC-081; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: full-grant
    kind: term
    en: {full: "full grant", definition: "A decision outcome that gives the applicant all that the application asks; every other result of a decision is adverse to the applicant."}
    fr: {full: "octroi complet", definition: "Issue d’une décision qui accorde à la personne tout ce que sa demande sollicite; tout autre résultat d’une décision lui est défavorable."}
    source: {name: "FPSOT applications specification, APP-032 and APP-052, after the result kinds of DEC-024; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: full-redirect
    kind: term
    en: {full: "full redirect", definition: "Sending the browser of the payer from a page of the body to the hosted payment page of the provider, with no part of the payment form on the page of the body."}
    fr: {full: "redirection complète", definition: "Envoi du navigateur de la personne d’une page de l’organisme vers la page de paiement hébergée du fournisseur, sans aucune partie du formulaire de paiement sur la page de l’organisme."}
    source: {name: "FPSOT fees specification, FEE-047, after FAQ 1588 of the PCI Security Standards Council; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: fundamental-rights-impact-assessment
    kind: term
    en: {full: "fundamental rights impact assessment", definition: "An assessment, before first use, of the effects of a high-risk artificial intelligence system on the fundamental rights of the people it concerns."}
    fr: {full: "analyse d'impact sur les droits fondamentaux", definition: "Analyse, avant la première utilisation, des effets d'un système d'intelligence artificielle à haut risque sur les droits fondamentaux des personnes visées."}
    source: {name: "Regulation (EU) 2024/1689, article 27, French version to confirm", url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj", checked: "2026-11-15"}
  - id: homologation
    kind: term
    en: {full: "homologation", definition: "A step before a tender in which a buyer checks that goods conform to a recognized standard or an established technical specification, and lists those that do."}
    fr: {full: "homologation", definition: "Étape préalable à un appel d'offres où l'organisme acheteur vérifie la conformité de biens à une norme reconnue ou à une spécification technique établie, et inscrit ceux qui s'y conforment sur une liste."}
    source: {name: "Règlement sur les contrats des organismes publics en matière de technologies de l'information, chapitre VI (French term kept in English; no GDT record checked)", url: "https://www.publicationsduquebec.gouv.qc.ca/fileadmin/Fichiers_client/lois_et_reglements/CodificationsAdministratives/C65_1_R5_1.pdf", checked: "2026-11-08"}
  - id: hosted-payment-page
    kind: term
    en: {full: "hosted payment page", definition: "A payment page that the provider serves on its own site, where the payer enters card data."}
    fr: {full: "page de paiement hébergée", definition: "Page de paiement que le fournisseur sert sur son propre site, où la personne saisit ses données de carte."}
    source: {name: "FPSOT fees specification, FEE-047; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: identity-provider
    kind: term
    en: {full: "identity provider", definition: "A service that signs people or workloads in and tells other services who they are and how they signed in."}
    fr: {full: "fournisseur d'identité", definition: "Service qui connecte des personnes ou des charges de travail et qui indique aux autres services qui elles sont et comment elles se sont connectées."}
    source: {name: "NIST SP 800-63C-4 (English); no GDT or TERMIUM Plus record found, French as used in Canadian French technical documentation", url: "https://pages.nist.gov/800-63-4/sp800-63c.html", checked: "2026-11-10"}
  - id: impact-level
    kind: term
    en: {full: "impact level", definition: "The grade of the impact of a decision type on people, from level 1 to level 4, which decides the controls that apply."}
    fr: {full: "niveau d'incidence", definition: "Degré de l'incidence d'un type de décision sur les personnes, du niveau 1 au niveau 4, qui détermine les contrôles applicables."}
    source: {name: "Treasury Board of Canada Secretariat, Algorithmic Impact Assessment tool (French page: niveau d'incidence), to confirm", url: "https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/responsible-use-ai/algorithmic-impact-assessment.html", checked: "2026-11-15"}
  - id: inclusion-proof
    kind: term
    en: {full: "inclusion proof", definition: "The list of hashes that links one entry to the root hash of a Merkle tree, and so proves that the tree holds the entry."}
    fr: {full: "preuve d'inclusion", definition: "Liste de condensés qui relie une entrée au condensé racine d'un arbre de Merkle, et prouve ainsi que l'arbre contient l'entrée."}
    source: {name: "RFC 9162, section 2.1.3; French form set by the FPSOT French review of 2026-11-11 (no GDT record found)", url: "https://www.rfc-editor.org/info/rfc9162", checked: "2026-11-11"}
  - id: indexation-step
    kind: term
    en: {full: "indexation step", definition: "The record, in a fee schedule, of how one indexed value was set: the rule, the published rate, the cap, the raw result, the deferral and the rounded result."}
    fr: {full: "étape d’indexation", definition: "Inscription, dans un barème de frais, de la façon dont une valeur indexée a été fixée : la règle, le taux publié, le plafond, le résultat brut, le report et le résultat arrondi."}
    source: {name: "FPSOT fees specification, FEE-024; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: jurisdiction
    kind: term
    en: {full: "jurisdiction", definition: "A government area, such as a country, province or municipality, with its own laws and rules."}
    fr: {full: "collectivité publique", definition: "Entité publique territoriale, comme un pays, une province ou une municipalité, qui a ses propres lois et règles."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8378880/collectivite-publique", checked: "2026-11-02"}
  - id: jurisdiction-profile
    kind: term
    en: {full: "jurisdiction profile", definition: "A released set of the legal parameters that the law of one jurisdiction sets for a kind of software, each with its source."}
    fr: {full: "profil juridictionnel", definition: "Ensemble publié des paramètres juridiques que le droit d’une collectivité publique fixe pour un genre de logiciel, chacun avec sa source."}
    source: {name: "Broader definition proposed by the FPSOT registry specification, REG-013, to replace the one of DEC-011; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: legal-effect
    kind: term
    en: {full: "legal effect", definition: "What registration does in law: identify an asset for the administration, give notice or opposability, or create or prove title."}
    fr: {full: "effet juridique", definition: "Ce que produit l’inscription en droit : identifier un bien pour l’administration, donner avis ou opposabilité, ou créer ou prouver le titre."}
    source: {name: "FPSOT registry specification, REG-011; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: legal-hold
    kind: term
    en: {full: "legal hold", definition: "A measure that stops the destruction of records that a request, a complaint, an incident or a lawsuit may need."}
    fr: {full: "préservation de la preuve", definition: "Mesure qui suspend la destruction des enregistrements dont une demande, une plainte, un incident ou une poursuite peut avoir besoin."}
    source: {name: "Grand dictionnaire terminologique, préservation de la preuve (English: legal hold, litigation hold)", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/18070177/preservation-de-la-preuve", checked: "2026-11-10"}
  - id: light-chain
    kind: term
    en: {full: "light chain", definition: "The link between the filings of one register, made of a sequence number and the commitment of the filing before, with no key of its own."}
    fr: {full: "chaîne légère", definition: "Lien entre les déclarations d’un registre, fait d’un numéro d’ordre et du condensé salé de la déclaration précédente, sans clé propre."}
    source: {name: "FPSOT registry specification, REG-030; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: linter
    kind: term
    en: {full: "linter", definition: "A tool that reads source code without running it and reports errors, risky patterns and breaches of style."}
    fr: {full: "analyseur statique", definition: "Outil qui lit le code source sans l’exécuter et signale les erreurs, les constructions risquées et les écarts de style."}
    source: {name: "FPSOT code specification, COD-002; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-code", checked: "2026-11-18"}
  - id: locale
    kind: term
    en: {full: "locale", definition: "A language together with the conventions of a region for dates, numbers, sorting and similar items."}
    fr: {full: "paramètre régional", definition: "Langue associée aux conventions d'une région pour les dates, les nombres, le tri et d'autres éléments semblables."}
    source: {name: "TERMIUM Plus", url: "https://www.btb.termiumplus.gc.ca/tpv2alpha/alpha-eng.html?lang=eng&srchtxt=locale", checked: "2026-11-04"}
  - id: lock-file
    kind: term
    en: {full: "lock file", definition: "A committed file that records the exact version and checksum of each resolved dependency."}
    fr: {full: "fichier de verrouillage", definition: "Fichier versionné qui consigne la version exacte et l’empreinte de chaque dépendance résolue."}
    source: {name: "npm Docs, config; French form to confirm", url: "https://docs.npmjs.com/cli/v11/using-npm/config", checked: "2026-11-18"}
  - id: log-series
    kind: term
    en: {full: "log series", definition: "The log that holds the commitments of the filings of one register and nothing else, cut into yearly shards."}
    fr: {full: "série de journal", definition: "Journal qui contient les condensés salés des déclarations d’un seul registre et rien d’autre, divisé en tranches annuelles."}
    source: {name: "FPSOT registry specification, REG-031, after LOG-032 and LOG-035; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: long-term-support
    kind: term
    en: {full: "long-term support", definition: "A release line that its publisher fixes for a stated, longer period than other releases."}
    fr: {full: "soutien à long terme", definition: "Branche de versions que son éditeur corrige pendant une période annoncée, plus longue que pour les autres versions."}
    source: {name: "Quarkus releases, for the English form; French form to confirm", url: "https://quarkus.io/releases/", checked: "2026-11-18"}
  - id: low-materiality-fee
    kind: term
    en: {full: "low-materiality fee", definition: "A federal fee that the Low-materiality Fees Regulations exclude from sections 3 to 18 of the Service Fees Act, such as a fee below $51."}
    fr: {full: "frais de faible importance", definition: "Frais fédéraux que le Règlement sur les frais de faible importance soustrait aux articles 3 à 18 de la Loi sur les frais de service, comme des frais inférieurs à 51 $."}
    source: {name: "Loi sur les frais de service, article 22 (official French form)", url: "https://laws-lois.justice.gc.ca/fra/lois/S-8.4/TexteComplet.html", checked: "2026-11-21"}
  - id: mirror
    kind: term
    en: {full: "mirror", definition: "A party that keeps and serves a full copy of a transparency log, so that the log outlives its operator."}
    fr: {full: "miroir", definition: "Partie qui conserve et diffuse une copie complète d'un journal de transparence, pour que le journal survive à son exploitant."}
    source: {name: "C2SP tlog-mirror v0.1.0; Grand dictionnaire terminologique, site miroir; French form set by the FPSOT French review of 2026-11-11", url: "https://github.com/C2SP/C2SP/blob/b2dd9892338af7009733a4575a6da05811ffae6c/tlog-mirror.md", checked: "2026-11-11"}
  - id: monitor
    kind: term
    en: {full: "monitor", definition: "A party that reads every entry of a transparency log and compares it with what the issuer meant to publish."}
    fr: {full: "vigie", definition: "Partie qui lit chaque entrée d'un journal de transparence et la compare avec ce que l'émetteur voulait publier."}
    source: {name: "RFC 9162, section 8.2 for the English form; French form set by the FPSOT French review of 2026-11-11 (vigie is the usual Québec word for a watch function)", url: "https://www.rfc-editor.org/info/rfc9162", checked: "2026-11-11"}
  - id: omission-reason
    kind: term
    en: {full: "omission reason", definition: "The code that tells why a view leaves a field out, such as a law, an application, a missing value or a destruction."}
    fr: {full: "motif d’omission", definition: "Code qui dit pourquoi une vue omet un champ, comme une loi, une demande, une valeur absente ou une destruction."}
    source: {name: "FPSOT registry specification, REG-073, after BODS 0.4; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: opposability
    kind: term
    en: {full: "opposability", definition: "The quality of a registered fact that a party can rely on against third parties."}
    fr: {full: "opposabilité", definition: "Qualité d’un fait inscrit qu’une partie peut faire valoir contre les tiers."}
    source: {name: "Civil Code of Québec, opposable aux tiers, for the French form, to be verified", url: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/CCQ-1991", checked: "2026-11-18"}
  - id: owner-group
    kind: term
    en: {full: "owner group", definition: "A group of parties that holds an interest in an asset, alone, jointly or in common with other groups."}
    fr: {full: "groupe de propriétaires", definition: "Groupe de parties qui détient un intérêt dans un bien, seul, conjointement ou en commun avec d’autres groupes."}
    source: {name: "FPSOT registry specification, REG-053, after the manufactured home register of British Columbia; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: ownership
    kind: term
    en: {full: "ownership", definition: "The fullest right a party can hold over an asset, within the limits of the law."}
    fr: {full: "propriété", definition: "Droit le plus complet qu'une partie peut détenir sur un bien, dans les limites de la loi."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8365758/droit-de-propriete", checked: "2026-11-02"}
  - id: party
    kind: term
    en: {full: "party", definition: "A person or an organization that a system records, such as one that holds rights or duties in a registry."}
    fr: {full: "partie", definition: "Personne ou organisation qu'un système enregistre, comme celle qui détient des droits ou des obligations inscrits dans un registre."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26550268/partie", checked: "2026-11-02"}
  - id: payment-attempt
    kind: term
    en: {full: "payment attempt", definition: "One try to pay a fee order through a payment provider, with its status and the history of that status."}
    fr: {full: "tentative de paiement", definition: "Essai de payer une demande de paiement par un fournisseur de paiement, avec son statut et l’historique de ce statut."}
    source: {name: "FPSOT fees specification, FEE-041 to FEE-043, after GOV.UK Pay; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: payment-provider
    kind: term
    en: {full: "payment provider", definition: "The service that takes a payment from the payer and sends the funds to the body, such as a card processor or a government payment platform."}
    fr: {full: "fournisseur de paiement", definition: "Service qui reçoit un paiement de la personne et verse les fonds à l’organisme, comme un service de traitement des cartes ou une plateforme gouvernementale de paiement."}
    source: {name: "FPSOT fees specification, FEE-001 and FEE-101; French form to confirm. France says prestataire de services de paiement", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: payment-reference
    kind: term
    en: {full: "payment reference", definition: "The reference of a fee order that the payer sees and quotes, which holds no personal information."}
    fr: {full: "référence de paiement", definition: "Référence d’une demande de paiement que la personne voit et cite, et qui ne contient aucun renseignement personnel."}
    source: {name: "FPSOT fees specification, FEE-040 and FEE-092; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: payout
    kind: term
    en: {full: "payout", definition: "One transfer of funds from a payment provider to the account of the body, which nets payments, refunds and fees."}
    fr: {full: "versement", definition: "Transfert de fonds d’un fournisseur de paiement au compte de l’organisme, qui compense des paiements, des remboursements et des frais."}
    source: {name: "FPSOT fees specification, FEE-090; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: performance-standard
    kind: term
    en: {full: "performance standard", definition: "The public level of service that a federal body must meet for a fee, under the Service Fees Act."}
    fr: {full: "norme de rendement", definition: "Niveau de service public qu’un organisme fédéral doit respecter pour des frais, selon la Loi sur les frais de service."}
    source: {name: "Loi sur les frais de service, articles 4 to 8 (official French form)", url: "https://laws-lois.justice.gc.ca/fra/lois/S-8.4/TexteComplet.html", checked: "2026-11-21"}
  - id: pleasure-craft-license
    kind: term
    en: {full: "pleasure craft license", definition: "The license that a pleasure craft in scope of the Small Vessel Regulations of Canada must carry."}
    fr: {full: "permis d’embarcation de plaisance", definition: "Permis que doit porter une embarcation de plaisance visée par le Règlement sur les petits bâtiments du Canada."}
    source: {name: "SOR/2025-272 and DORS/2025-272, Canada Gazette, Part II (official forms in both languages)", url: "https://gazette.gc.ca/rp-pr/p2/2025/2025-12-31/html/sor-dors272-fra.html", checked: "2026-11-18"}
  - id: plugin
    kind: term
    en: {full: "plugin", definition: "A component that adds a function to a tool, such as a build tool or a linter."}
    fr: {full: "plugiciel", definition: "Composant qui ajoute une fonction à un outil, comme un outil de construction ou un analyseur statique."}
    source: {name: "Office québécois de la langue française, plugiciel; to confirm", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/", checked: "2026-11-18"}
  - id: principal-reason
    kind: term
    en: {full: "principal reason", definition: "A reason that drove the result of a decision more than the others, of which a notice gives at most four."}
    fr: {full: "motif principal", definition: "Motif qui a pesé plus que les autres sur le résultat d'une décision, et dont un avis donne au plus quatre."}
    source: {name: "Consumer Financial Protection Bureau, Regulation B, for the English form; French form to confirm", url: "https://www.consumerfinance.gov/rules-policy/regulations/1002/9/", checked: "2026-11-15"}
  - id: privacy-impact-assessment
    kind: term
    en: {full: "privacy impact assessment", definition: "A study, done before a system changes, of how the system affects the privacy of people and of how to reduce the risks."}
    fr: {full: "évaluation des facteurs relatifs à la vie privée", definition: "Étude, faite avant de modifier un système, de ses effets sur la vie privée des personnes et des façons d'en réduire les risques."}
    source: {name: "Gouvernement du Québec, Évaluation des facteurs relatifs à la vie privée (no GDT record found; the Québec and federal governments use this French term)", url: "https://www.quebec.ca/gouvernement/travailler-gouvernement/normes-gouvernance-pratiques-internes/protection-des-renseignements-personnels/evaluation-facteurs-relatifs-vie-privee", checked: "2026-11-10"}
  - id: progressive-enhancement
    kind: term
    en: {full: "progressive enhancement", definition: "Building a page that works in plain HTML first, then adding styles and scripts that improve it where they run."}
    fr: {full: "amélioration progressive", definition: "Façon de construire une page qui fonctionne d’abord en HTML simple, puis d’ajouter des styles et des scripts qui l’améliorent là où ils s’exécutent."}
    source: {name: "GOV.UK Service Manual; French form to confirm", url: "https://www.gov.uk/service-manual/technology/using-progressive-enhancement", checked: "2026-11-18"}
  - id: provider-adapter
    kind: term
    en: {full: "provider adapter", definition: "The component that links a fee engine to one payment provider, and maps the statuses of the provider onto those of the specification."}
    fr: {full: "adaptateur de fournisseur", definition: "Composant qui relie un moteur de frais à un fournisseur de paiement, et fait correspondre les statuts du fournisseur à ceux de la spécification."}
    source: {name: "FPSOT fees specification, FEE-002 and FEE-101; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: provider-notification
    kind: term
    en: {full: "provider notification", definition: "A signed message that a payment provider sends to tell a body that an object changed, often called a webhook."}
    fr: {full: "avis du fournisseur", definition: "Message signé qu’un fournisseur de paiement envoie pour informer un organisme qu’un objet a changé, souvent appelé webhook."}
    source: {name: "FPSOT fees specification, FEE-070 to FEE-072; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: publicity-regime
    kind: term
    en: {full: "publicity regime", definition: "Who may see a register: everyone, everyone with exceptions, people who meet a condition, or no one outside the body."}
    fr: {full: "régime de publicité", definition: "Qui peut voir un registre : tout le monde, tout le monde avec des exceptions, les personnes qui remplissent une condition, ou personne hors de l’organisme."}
    source: {name: "FPSOT registry specification, REG-012; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: reason-code
    kind: term
    en: {full: "reason code", definition: "The code of a concept of a reason scheme that names one factor of a decision."}
    fr: {full: "code de motif", definition: "Code d'un concept d'un schéma de motifs qui nomme un facteur d'une décision."}
    source: {name: "FPSOT decisions specification, DEC-050; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: receipt
    kind: term
    en: {full: "receipt", definition: "A sealed record of what a fee order cost and of each payment, refund and remission against it."}
    fr: {full: "reçu", definition: "Document cacheté de ce qu’une demande de paiement a coûté et de chaque paiement, remboursement et remise qui s’y rattache."}
    source: {name: "FPSOT fees specification, FEE-080 and FEE-081; French form approved by the lead", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: receipt-record
    kind: term
    en: {full: "receipt record", definition: "The sealed record of when a submission became accessible to a public body, from whom, through which channel, with the digests of what arrived."}
    fr: {full: "constat de réception", definition: "Donnée cachetée du moment où un dépôt est devenu accessible à un organisme public, de qui, par quel canal, avec les condensés de ce qui est arrivé."}
    source: {name: "FPSOT applications specification, APP-040 to APP-042, after article 31 of the Loi concernant le cadre juridique des technologies de l'information; French form approved by the lead on 2026-11-26", url: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/C-1.1", checked: "2026-11-23"}
  - id: reconciliation
    kind: term
    en: {full: "reconciliation", definition: "Matching each line of each payout of a provider to one payment attempt, refund or dispute, to the cent."}
    fr: {full: "rapprochement", definition: "Rattachement de chaque ligne de chaque versement d’un fournisseur à une seule tentative de paiement, un seul remboursement ou une seule contestation, au cent près."}
    source: {name: "FPSOT fees specification, FEE-091; French form approved by the lead", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: record-time
    kind: term
    en: {full: "record time", definition: "The knowledge cutoff of a decision: only facts and rule versions recorded at or before it count."}
    fr: {full: "moment d'enregistrement", definition: "Limite de connaissance d'une décision : seuls comptent les faits et les versions de règles enregistrés à ce moment ou avant."}
    source: {name: "Martin Fowler, Bitemporal History, for the English form; French form to confirm", url: "https://martinfowler.com/articles/bitemporal-history.html", checked: "2026-11-15"}
  - id: reference-number
    kind: term
    en: {full: "reference number", definition: "The random number that an applicant quotes for an application file, with a check character, which tells nothing about the person or the matter."}
    fr: {full: "numéro de référence", definition: "Numéro aléatoire qu’une personne cite pour un dossier de demande, avec un caractère de contrôle, qui ne révèle rien de la personne ni de l’affaire."}
    source: {name: "FPSOT applications specification, APP-045; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: refund
    kind: term
    en: {full: "refund", definition: "Money that goes back to a payer because the body should not keep it, such as a fee for a service that it did not provide."}
    fr: {full: "remboursement", definition: "Argent rendu à une personne parce que l’organisme ne devrait pas le garder, comme des frais pour un service qu’il n’a pas rendu."}
    source: {name: "Règlement de 1997 sur le remboursement de recettes, DORS/98-127 (official French form), approved by the lead", url: "https://laws-lois.justice.gc.ca/fra/reglements/DORS-98-127/TexteComplet.html", checked: "2026-11-21"}
  - id: refundable-balance
    kind: term
    en: {full: "refundable balance", definition: "The part of a successful payment that refunds have not yet returned."}
    fr: {full: "solde remboursable", definition: "Partie d’un paiement réussi que les remboursements n’ont pas encore rendue."}
    source: {name: "FPSOT fees specification, FEE-061, after GOV.UK Pay; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: register
    kind: term
    en: {full: "register", definition: "One registry that a law establishes, with its legal effect, its publicity regime and its filings."}
    fr: {full: "registre", definition: "Registre établi par une loi, avec son effet juridique, son régime de publicité et ses déclarations."}
    source: {name: "FPSOT registry specification, REG-010; same French form as registry", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: register-operator
    kind: term
    en: {full: "register operator", definition: "The body or the supplier that runs a register and serves its views, searches and extracts."}
    fr: {full: "exploitant de registre", definition: "Organisme ou fournisseur qui fait fonctionner un registre et en sert les vues, les recherches et les extraits."}
    source: {name: "FPSOT registry specification, REG-002; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: registration
    kind: term
    en: {full: "registration", definition: "The entry of a fact or a right in a register."}
    fr: {full: "inscription", definition: "Entrée d’un fait ou d’un droit dans un registre."}
    source: {name: "Civil Code of Québec, book on the publication of rights, for the French form, to be verified", url: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/CCQ-1991", checked: "2026-11-18"}
  - id: registry
    kind: term
    en: {full: "registry", definition: "An official, lasting record of facts, such as who holds which rights over what."}
    fr: {full: "registre", definition: "Recueil officiel et durable de faits, par exemple qui détient quels droits sur quoi."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8355393/registre-public", checked: "2026-11-02"}
  - id: remission
    kind: term
    en: {full: "remission", definition: "A decision under a law to forgive or return all or part of an amount that a payer owed, such as after a missed performance standard."}
    fr: {full: "remise", definition: "Décision prise en vertu d’une loi de renoncer à tout ou partie d’une somme due, ou de la rendre, comme après une norme de rendement non respectée."}
    source: {name: "Loi sur les frais de service, article 7 (official French form), approved by the lead", url: "https://laws-lois.justice.gc.ca/fra/lois/S-8.4/TexteComplet.html", checked: "2026-11-21"}
  - id: replay
    kind: term
    en: {full: "replay", definition: "Applying the stated changes of completed filings in order, to rebuild the state of a register."}
    fr: {full: "rejeu", definition: "Application, dans l’ordre, des changements déclarés des déclarations achevées, pour reconstruire l’état d’un registre."}
    source: {name: "FPSOT registry specification, REG-040; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: repository
    kind: term
    en: {full: "repository", definition: "A store of a project's files and their full history of changes."}
    fr: {full: "dépôt", definition: "Espace où sont conservés les fichiers d'un projet et l'historique complet de leurs modifications."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26584236/depot-de-code-source", checked: "2026-11-02"}
  - id: reproducible-build
    kind: term
    en: {full: "reproducible build", definition: "A build that gives the same bytes each time from the same source, tools and settings."}
    fr: {full: "construction reproductible", definition: "Construction qui donne les mêmes octets chaque fois, à partir de la même source, des mêmes outils et des mêmes paramètres."}
    source: {name: "Apache Maven, Configuring for Reproducible Builds; French form to confirm", url: "https://maven.apache.org/guides/mini/guide-reproducible-builds.html", checked: "2026-11-18"}
  - id: request-for-information
    kind: term
    en: {full: "request for information", definition: "A message in which a public body asks the applicant for missing or corrected items, with its reason, its deadline and its effect on each clock."}
    fr: {full: "demande de renseignements", definition: "Message par lequel un organisme public demande à la personne des éléments manquants ou corrigés, avec son motif, son échéance et son effet sur chaque décompte."}
    source: {name: "FPSOT applications specification, APP-050; French form approved by the lead on 2026-11-26", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: requirement
    kind: term
    en: {full: "requirement", definition: "A statement in a specification that a conforming product or process must satisfy."}
    fr: {full: "exigence", definition: "Énoncé d'une spécification qu'un produit ou un processus conforme doit respecter."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8871085/exigence", checked: "2026-11-02"}
  - id: restatement
    kind: term
    en: {full: "restatement", definition: "A later version of an entity that a retroactive filing repeats in full, so that the replay never runs the rules again."}
    fr: {full: "réénoncé", definition: "Version ultérieure d’une entité qu’une déclaration rétroactive répète au complet, pour que le rejeu n’exécute jamais de nouveau les règles."}
    source: {name: "FPSOT registry specification, REG-034; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: result-kind
    kind: term
    en: {full: "result kind", definition: "One of the four kinds of result of the decision contract: decided, referred, insufficient information or not applicable."}
    fr: {full: "type de résultat", definition: "Un des quatre types de résultat du contrat de décision : décidé, renvoyé, renseignements insuffisants ou sans objet."}
    source: {name: "FPSOT decisions specification, DEC-024; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: retention-class
    kind: term
    en: {full: "retention class", definition: "How long one kind of filing or evidence stays in a register, and the rule of the retention schedule that says so."}
    fr: {full: "catégorie de conservation", definition: "Durée pendant laquelle un genre de déclaration ou de pièce reste dans un registre, et règle du calendrier de conservation qui la fixe."}
    source: {name: "FPSOT registry specification, REG-090; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: review-step
    kind: term
    en: {full: "review step", definition: "The record of one action of one person on a decision record that a service showed them."}
    fr: {full: "étape de révision", definition: "Enregistrement d'une action d'une personne sur un enregistrement de décision qu'un service lui a présenté."}
    source: {name: "FPSOT decisions specification, DEC-062; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: rounding-rule
    kind: term
    en: {full: "rounding rule", definition: "A rounding method with its step for each band of results and where a result halfway goes."}
    fr: {full: "règle d’arrondi", definition: "Méthode d’arrondi avec son pas pour chaque tranche de résultats et la direction d’un résultat à mi-chemin."}
    source: {name: "FPSOT fees specification, FEE-025, after DAT-054; French form to confirm. The Québec regulation says arrondissement for the act of rounding a fee", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: rule-provider
    kind: term
    en: {full: "rule provider", definition: "Software that implements the rules of one decision type behind the decision contract."}
    fr: {full: "fournisseur de règles", definition: "Logiciel qui met en œuvre les règles d'un type de décision derrière le contrat de décision."}
    source: {name: "FPSOT decisions specification, DEC-002; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: rule-version
    kind: term
    en: {full: "rule version", definition: "One released version of the rules of a decision type, with its validity, its enactment time and its legal sources."}
    fr: {full: "version de règles", definition: "Version publiée des règles d'un type de décision, avec sa période de validité, son moment d'adoption et ses sources juridiques."}
    source: {name: "FPSOT decisions specification, DEC-030; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-decisions", checked: "2026-11-15"}
  - id: rules-as-code
    kind: term
    en: {full: "rules as code", definition: "The practice of writing the rules of a law or a policy as code that a machine can run, next to the legal text."}
    fr: {full: "règles sous forme de code", definition: "Pratique qui consiste à rédiger les règles d'une loi ou d'une politique sous forme de code exécutable par une machine, à côté du texte juridique."}
    source: {name: "OECD, Cracking the Code (2020), for the English form; French form to confirm", url: "https://www.oecd.org/en/publications/cracking-the-code_3afe6ba5-en.html", checked: "2026-11-15"}
  - id: seal
    kind: term
    en: {full: "seal", definition: "An advanced electronic signature that an organization applies as an organization, to prove that it issued a record and that nobody changed it since."}
    fr: {full: "cachet électronique", definition: "Signature électronique avancée qu'une organisation appose en son propre nom, pour prouver qu'elle a émis un document et que personne ne l'a modifié depuis."}
    source: {name: "Règlement (UE) no 910/2014, version française, article 3, cachet électronique (English: electronic seal)", url: "https://eur-lex.europa.eu/eli/reg/2014/910/2024-05-20/fra", checked: "2026-11-11"}
  - id: sealed-type
    kind: term
    en: {full: "sealed type", definition: "A class or interface that names every type allowed to extend or implement it."}
    fr: {full: "type scellé", definition: "Classe ou interface qui nomme chaque type autorisé à l’étendre ou à la mettre en œuvre."}
    source: {name: "OpenJDK, JEP 409, for the English form; French form to confirm", url: "https://openjdk.org/jeps/409", checked: "2026-11-18"}
  - id: search-mode
    kind: term
    en: {full: "search mode", definition: "A declared way to search a register, with its keys, its matching rule and the views that may use it."}
    fr: {full: "mode de recherche", definition: "Façon déclarée de chercher dans un registre, avec ses clés, sa règle de correspondance et les vues qui peuvent l’employer."}
    source: {name: "FPSOT registry specification, REG-080; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: sequence-number
    kind: term
    en: {full: "sequence number", definition: "The number of a filing in its register, from 1 with no gap."}
    fr: {full: "numéro d’ordre", definition: "Numéro d’une déclaration dans son registre, à partir de 1 et sans trou."}
    source: {name: "FPSOT registry specification, REG-030; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: service-declaration
    kind: term
    en: {full: "service declaration", definition: "The file in which a program states its forms, its clocks, its channels, its drafts and its rules on closing and self-declared submissions."}
    fr: {full: "déclaration de service", definition: "Fichier dans lequel un programme indique ses formulaires, ses décomptes, ses canaux, ses brouillons et ses règles sur la fermeture et le dépôt sur simple déclaration."}
    source: {name: "FPSOT applications specification, APP-012; French form to confirm; not to be confused with the déclaration de services aux citoyens of article 6 of the Loi sur l'administration publique", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: service-standard
    kind: term
    en: {full: "service standard", definition: "A published promise of how well or how fast a service performs in normal conditions, in a form that can be measured."}
    fr: {full: "norme de service", definition: "Promesse publiée sur la qualité ou la rapidité d’un service dans des conditions normales, sous une forme mesurable."}
    source: {name: "Policy on Service and Digital, Treasury Board of Canada Secretariat, definitions (official French form; definition in FPSOT wording)", url: "https://www.tbs-sct.canada.ca/pol/doc-eng.aspx?id=32603", checked: "2026-11-23"}
  - id: settlement
    kind: term
    en: {full: "settlement", definition: "The fact that a payout carried the funds of a successful payment attempt to the account of the body."}
    fr: {full: "réception des fonds", definition: "Fait qu’un versement a porté les fonds d’une tentative de paiement réussie au compte de l’organisme."}
    source: {name: "FPSOT fees specification, FEE-044; French form approved by the lead on 2026-11-22", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: single-page-application
    kind: term
    en: {full: "single-page application", definition: "A web application that loads one page and then renders each view with scripts in the browser."}
    fr: {full: "application monopage", definition: "Application Web qui charge une seule page, puis affiche chaque vue au moyen de scripts dans le navigateur."}
    source: {name: "FPSOT code specification, COD-606; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-code", checked: "2026-11-18"}
  - id: status
    kind: term
    en: {full: "status", definition: "Where one track of the processing of a filing stands, such as its payment, its review or its processing."}
    fr: {full: "statut", definition: "Point où en est un volet du traitement d’une déclaration, comme son paiement, son examen ou son traitement."}
    source: {name: "FPSOT registry specification, REG-024; French form to confirm, see decision 4", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: status-projection
    kind: term
    en: {full: "status projection", definition: "What an applicant sees of an application file: one label of a closed published list, mapped from its state, and what to do when action is needed."}
    fr: {full: "projection d’état", definition: "Ce qu’une personne voit d’un dossier de demande : une étiquette d’une liste fermée et publiée, tirée de son état, et ce qu’il faut faire quand une action est requise."}
    source: {name: "FPSOT applications specification, APP-080 and APP-081; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-applications", checked: "2026-11-26"}
  - id: style-edition
    kind: term
    en: {full: "style edition", definition: "A named set of formatters and linters, with their versions and settings, that a project adopts as a whole."}
    fr: {full: "édition de style", definition: "Ensemble nommé d’outils de mise en forme et d’analyseurs statiques, avec leurs versions et leurs paramètres, qu’un projet adopte en bloc."}
    source: {name: "FPSOT code specification, COD-018, after the style editions of Rust; French form to confirm", url: "https://github.com/rust-lang/rust/blob/master/src/doc/style-guide/src/editions.md", checked: "2026-11-18"}
  - id: tenancy
    kind: term
    en: {full: "tenancy", definition: "How an owner group holds its interest: sole, joint or in common."}
    fr: {full: "mode de détention", definition: "Façon dont un groupe de propriétaires détient son intérêt : seul, conjointement ou en commun."}
    source: {name: "FPSOT registry specification, REG-053; French form to confirm. Common law French uses tenance conjointe and tenance commune; Québec civil law speaks of indivision, which is not the same concept", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: test-double
    kind: term
    en: {full: "test double", definition: "A component that stands in for a real dependency during a test, such as a component that returns fixed answers."}
    fr: {full: "doublure de test", definition: "Composant qui remplace une dépendance réelle pendant un test, par exemple un composant qui renvoie des réponses fixes."}
    source: {name: "ISTQB Glossary 4.8.1, test double (no GDT record found)", url: "https://glossary.istqb.org/en_US/term/test-double", checked: "2026-11-08"}
  - id: time-stamp
    kind: term
    en: {full: "time stamp", definition: "A token in which a trusted authority signs a hash and the time at which it saw that hash."}
    fr: {full: "horodatage électronique", definition: "Jeton dans lequel une autorité de confiance signe un condensé et l'heure à laquelle elle l'a reçu."}
    source: {name: "Règlement (UE) no 910/2014, version française, article 3, horodatage électronique (English: electronic time stamp)", url: "https://eur-lex.europa.eu/eli/reg/2014/910/2024-05-20/fra", checked: "2026-11-11"}
  - id: tombstone
    kind: term
    en: {full: "tombstone", definition: "What remains of a lawfully destroyed filing: its place in the chain, its dates, its type and the ids of its rows, with no other value."}
    fr: {full: "trace de destruction", definition: "Ce qui reste d’une déclaration détruite légalement : sa place dans la chaîne, ses dates, son type et les identifiants de ses lignes, sans autre valeur."}
    source: {name: "FPSOT registry specification, REG-094; French form provisional, see decision 2", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: toolchain
    kind: term
    en: {full: "toolchain", definition: "The compiler or runtime of a language, with the tools that come with it, at one version."}
    fr: {full: "chaîne d’outils", definition: "Compilateur ou environnement d’exécution d’un langage, avec les outils qui l’accompagnent, à une version donnée."}
    source: {name: "Go Toolchains, for the English form; French form to confirm", url: "https://go.dev/doc/toolchain", checked: "2026-11-18"}
  - id: transparency-log
    kind: term
    en: {full: "transparency log", definition: "A public, append-only list of entries in a Merkle tree, whose signed checkpoints let anyone check that an entry is in the list and that the list only grows."}
    fr: {full: "journal de transparence", definition: "Liste publique d'entrées, en ajout seul, dans un arbre de Merkle, dont les points de contrôle signés permettent à quiconque de vérifier qu'une entrée s'y trouve et que la liste ne fait que croître."}
    source: {name: "RFC 9162 for the English form; French form set by the FPSOT French review of 2026-11-11 (no GDT record found)", url: "https://www.rfc-editor.org/info/rfc9162", checked: "2026-11-11"}
  - id: trust-anchor
    kind: term
    en: {full: "trust anchor", definition: "A public key or certificate that a verifier trusts without proof, and from which it checks the chains of other certificates."}
    fr: {full: "ancre de confiance", definition: "Clé publique ou certificat auquel un vérificateur se fie sans preuve, et à partir duquel il vérifie la chaîne des autres certificats."}
    source: {name: "RFC 5280 usage for the English form; French form set by the FPSOT French review of 2026-11-11 (no GDT record found; TERMIUM Plus not checked)", url: "https://www.rfc-editor.org/info/rfc5280", checked: "2026-11-11"}
  - id: trusted-publishing
    kind: term
    en: {full: "trusted publishing", definition: "Publishing a package from CI with a short-lived identity token instead of a stored secret."}
    fr: {full: "publication de confiance", definition: "Publication d’un paquet depuis l’IC au moyen d’un jeton d’identité de courte durée, au lieu d’un secret conservé."}
    source: {name: "npm Docs, Trusted publishing; French form to confirm", url: "https://docs.npmjs.com/trusted-publishers/", checked: "2026-11-18"}
  - id: valid-time
    kind: term
    en: {full: "valid time", definition: "The time during which a fact holds in the world, as opposed to the time at which a system recorded it."}
    fr: {full: "temps de validité", definition: "Temps pendant lequel un fait vaut dans le monde, par opposition au moment où un système l’a enregistré."}
    source: {name: "FPSOT registry specification, REG-042; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: verifiable-credential
    kind: term
    en: {full: "verifiable credential", definition: "A set of claims by an issuer, in the W3C data model, whose origin and integrity anyone can check."}
    fr: {full: "attestation vérifiable", definition: "Ensemble d’affirmations d’un émetteur, selon le modèle de données du W3C, dont chacun peut vérifier l’origine et l’intégrité."}
    source: {name: "W3C Verifiable Credentials Data Model v2.0 for the English form; French form to confirm", url: "https://www.w3.org/TR/2025/REC-vc-data-model-2.0-20250515/", checked: "2026-11-18"}
  - id: virtual-thread
    kind: term
    en: {full: "virtual thread", definition: "A light Java thread that the JDK schedules on a small number of platform threads."}
    fr: {full: "fil virtuel", definition: "Fil d’exécution Java léger que le JDK planifie sur un petit nombre de fils de la plateforme."}
    source: {name: "OpenJDK, JEP 444, for the English form; French form to confirm", url: "https://openjdk.org/jeps/444", checked: "2026-11-18"}
  - id: visibility-class
    kind: term
    en: {full: "visibility class", definition: "Who may see a field of a register: the public, the parties, the agency or only named roles."}
    fr: {full: "catégorie de visibilité", definition: "Qui peut voir un champ d’un registre : le public, les parties, l’organisme ou seulement des rôles nommés."}
    source: {name: "FPSOT registry specification, REG-070; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-registry", checked: "2026-11-18"}
  - id: vulnerability
    kind: term
    en: {full: "vulnerability", definition: "A weakness in software or in a specification that an attacker can exploit to harm its security."}
    fr: {full: "vulnérabilité", definition: "Faiblesse d'un logiciel ou d'une spécification qu'un attaquant peut exploiter pour nuire à sa sécurité."}
    source: {name: "Grand dictionnaire terminologique", url: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/26578865/vulnerabilite", checked: "2026-11-08"}
  - id: waiver
    kind: term
    en: {full: "waiver", definition: "A choice of a person with the authority to excuse a payer from a fee, where the law allows discretion."}
    fr: {full: "dispense", definition: "Choix d’une personne qui a le pouvoir d’exempter une personne de frais, quand la loi laisse une discrétion."}
    source: {name: "FPSOT fees specification, FEE-028, after DEC-026; French form to confirm", url: "https://github.com/fpsot-org/fpsot-spec-fees", checked: "2026-11-21"}
  - id: witness
    kind: term
    en: {full: "witness", definition: "An independent party that cosigns a checkpoint of a transparency log only after it checks that the log has only grown since the last checkpoint it saw."}
    fr: {full: "témoin", definition: "Partie indépendante qui ne cosigne un point de contrôle d'un journal de transparence qu'après avoir vérifié que le journal n'a fait que croître depuis le dernier point de contrôle vu."}
    source: {name: "C2SP tlog-witness v1.1.0; the French form follows fpsot-spec-observability (no GDT record found for this sense)", url: "https://github.com/C2SP/C2SP/blob/b2dd9892338af7009733a4575a6da05811ffae6c/tlog-witness.md", checked: "2026-11-11"}
  - id: workflow
    kind: term
    en: {full: "workflow", definition: "A file that tells a CI service which jobs to run, on which events."}
    fr: {full: "flux de travail", definition: "Fichier qui indique à un service d’IC quelles tâches exécuter, et à quels événements."}
    source: {name: "GitHub Docs, Secure use reference; French form to confirm", url: "https://docs.github.com/en/actions/reference/security/secure-use", checked: "2026-11-18"}
  - id: xml
    kind: abbreviation
    en: {short: "XML", full: "Extensible Markup Language", definition: "The W3C text format that marks up structured data with nested, named elements."}
    fr: {short: "XML", full: "Extensible Markup Language", definition: "Format texte du W3C qui balise des données structurées au moyen d'éléments nommés et imbriqués."}
    source: {name: "W3C, Extensible Markup Language (XML) 1.0 (Fifth Edition) (no GDT record found; TERMIUM Plus could not be read)", url: "https://www.w3.org/TR/xml/", checked: "2026-11-07"}
  - id: yaml
    kind: abbreviation
    en: {short: "YAML", full: "YAML Ain’t Markup Language", definition: "A text format for structured data that uses indentation, common in configuration files."}
    fr: {short: "YAML", full: "YAML Ain’t Markup Language", definition: "Format texte pour les données structurées qui repose sur l’indentation, courant dans les fichiers de configuration."}
    source: {name: "yaml.org (proper name, kept in English)", url: "https://yaml.org/spec/1.2.2/", checked: "2026-11-18"}
